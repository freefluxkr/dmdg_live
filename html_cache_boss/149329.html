<h1 class="page-subject">3-5. 파일과 폴더 다루기</h1>
<hr class="title-divider"/>
<div class="page-content tex2jax_process">
<h1 id="_1">경로 관련 라이브러리</h1>
<h3 id="1-os">1. os</h3>
<p>os 모듈은 폴더(디렉토리)를 생성하거나 경로(path)를 다룰 때 사용합니다.</p>
<h3 id="2-shutil">2. shutil</h3>
<p>shutil 모듈은 파일을 복사하거나 이동시킬 때 사용합니다.</p>
<h3 id="3-glob">3. glob</h3>
<p>glob 모듈은 패턴을 사용하여 현재 폴더(디렉토리)는 물론 하위 경로의 파일들을 검색할 때 사용합니다.</p>
</div>
