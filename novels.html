<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMDG 스튜디오 | eBook & 오디오북 컬렉션</title>
  <meta name="description" content="위키독스 화제의 미래 3부작과 거장들의 지정학 팩션 소설을 6개 국어 음성 합성(TTS)으로 만나는 프리미엄 몰입형 E-Reader">
  <link rel="icon" type="image/png" href="logo_circle.png">

  <!-- Micro-Frontend Modular Stylesheet -->
  <link rel="stylesheet" href="css/modules/novels.css">
</head>
<body class="theme-dark">

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-inner">
        <a href="index.html" class="brand-wrapper" id="btn-home">
          <div class="brand-logo-icon">📖</div>
          <div>
            <div class="brand-title">DMDG 스튜디오 <span class="brand-badge">eBook & Audio</span></div>
          </div>
        </a>

        <!-- Controls: Language Selector, Theme, Fullscreen -->
        <div class="header-actions">
          <!-- Global 6-Flag Language Selector -->
          <div class="lang-selector-container" title="오디오북 낭독 언어 선택">
            <span class="lang-selector-label">🌐 음성 언어:</span>
            <select id="reader-lang-select" class="lang-select-dropdown">
              <option value="ko-KR" selected>🇰🇷 KR (한국어)</option>
              <option value="en-US">🇺🇸 EN (영어)</option>
              <option value="ja-JP">🇯🇵 JA (일본어)</option>
              <option value="fr-FR">🇫🇷 FR (프랑스어)</option>
              <option value="id-ID">🇮🇩 ID (인도네시아어)</option>
              <option value="es-ES">🇪🇸 ES (스페인어)</option>
            </select>
          </div>

          <button id="btn-theme-toggle" class="btn-ctrl" title="배경 테마 변경 (단축키: T)">
            <span id="theme-icon">🌙</span>
            <span id="theme-label" class="hide-mobile">다크</span>
          </button>

          <button id="btn-fullscreen" class="btn-ctrl hide-mobile" title="전체화면 전환 (단축키: F11)">
            <span>⛶</span>
          </button>
        </div>
      </div>

      <!-- Reading Progress Track -->
      <div class="reading-progress-track">
        <div id="reader-progress" class="reading-progress-fill"></div>
      </div>
    </header>

    <!-- Bookshelf View (Default) -->
    <main id="bookshelf-view" class="bookshelf-section">
      <div class="bookshelf-hero">
        <div class="bookshelf-hero-badge">✨ 2026-2027 MASTERPIECE FACTION</div>
        <h1 class="bookshelf-hero-title">DMDG 스튜디오 eBook & 오디오북</h1>
        <p class="bookshelf-hero-desc">거장들의 팩션 소설과 미래 드라마를 6개 국어 AI 오디오북으로 감상하세요.<br>(*기술 서적은 도서관 &lt;Books&gt; 전용 코너에서 제공됩니다)</p>
      </div>

      <!-- Genre Filter Chips -->
      <div class="filter-bar">
        <button class="filter-chip active" data-filter="all">전체 작품</button>
        <button class="filter-chip" data-filter="cypher">🔐 Cypher.D (암호학/사이버 스릴러)</button>
        <button class="filter-chip" data-filter="kmin">🇰🇷 K.Min (지정학 팩션 랩)</button>
        <button class="filter-chip" data-filter="scifi">⚡ 미래 테크 드라마</button>
      </div>

      <!-- Books Grid -->
      <div id="books-grid-container" class="books-grid">
        <!-- Rendered dynamically via reader-main.js -->
      </div>
    </main>

    <!-- Reader Section (Hidden initially) -->
    <section id="reader-view" class="reader-section">
      <!-- Floating Audio TTS Bar -->
      <div class="reader-audio-bar">
        <div class="audio-controls-group">
          <button id="btn-back-to-shelf" class="btn-ctrl" title="책장으로 돌아가기">
            <span>←</span> <span>서재로</span>
          </button>
          <button id="btn-toggle-toc" class="btn-ctrl" title="목차 열기 (단축키: M)">
            <span>📑</span> <span>목차</span>
          </button>
        </div>

        <div class="audio-controls-group">
          <div class="tts-status-indicator">
            <span id="tts-pulse" class="tts-pulse"></span>
            <span id="tts-status-desc" class="hide-mobile">6개 국어 음성 준비됨</span>
          </div>

          <button id="btn-tts-play" class="btn-ctrl active" title="AI 음성 낭독 시작/정지 (단축키: Space)">
            <span id="tts-icon">▶️</span>
            <span id="tts-text">AI 낭독</span>
          </button>

          <button id="btn-tts-speed" class="btn-ctrl" title="낭독 속도 변경">
            1.0x
          </button>
        </div>

        <div class="audio-controls-group hide-mobile">
          <button id="btn-font-dec" class="btn-ctrl" title="글자 축소">A-</button>
          <button id="btn-font-inc" class="btn-ctrl" title="글자 확대">A+</button>
        </div>
      </div>

      <!-- Reader Body Container -->
      <article class="reader-container">
        <header class="reader-header">
          <div id="reader-book-title" class="reader-book-title">작품 제목</div>
          <h2 id="reader-chapter-title" class="reader-chapter-title">장 제목</h2>
        </header>

        <div id="reader-content" class="reader-content">
          <!-- Chapter Content rendered dynamically -->
        </div>

        <!-- Chapter Navigation Footer -->
        
  <!-- DMDG Framework Official Footer -->
  <dmdg-footer site="dmdg_live"></dmdg-footer>
  <script src="../dmdg_framework/js/dmdg-footer.js"></script>

      </article>
    </section>

    <!-- Table of Contents Drawer -->
    <aside id="toc-drawer" class="toc-drawer">
      <div class="toc-header">
        <h3 id="toc-drawer-book-title">작품 목차</h3>
        <button id="btn-close-toc" class="toc-close-btn" title="목차 닫기">✕</button>
      </div>
      <ul id="toc-items-list" class="toc-list">
        <!-- Rendered via JavaScript -->
      </ul>
    </aside>
    <div id="drawer-backdrop" class="drawer-backdrop"></div>
  </div>

  <!-- Micro-Frontend Entry Point -->
  <script type="module" src="js/reader/reader-main.js"></script>
</body>
</html>
