<p class="txt2 dm blue box_orange_line"><span class="bg_pink4">2</span> 연산자 사용하기</p>
<p class="txt bl">연산자<span class="txts gray">(演算子, operator)</span>라는 말을 처음 들으면 무척 낯설게 느껴질 텐데요. 사실 우리는 연산자를 본 적이 있습니다. 그것도 4개나 말이죠. +, -, <span class="cd">**</span>, 그리고 오른쪽 값을 왼쪽 변수에 대입하는 역할을 했던 =도 연산자입니다. 코드를 차근차근 따라해보며 값을 이리저리 바꾸다 보면 금세 익숙해질 겁니다.</p>
