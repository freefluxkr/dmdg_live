<p class="txt1 dm"><span class="cap blue">■</span> 주사위 시뮬레이션</p>
<p class="txt bl">기온 데이터를 히스토그램 형태로 시각화하기에 앞서 히스토그램 표현을 연습해 보겠습니다. 임의의 수를 뽑는 랜덤 함수를 활용해 간단한 주사위 시뮬레이션을 만들겠습니다.</p>
<div class="w30"><img alt="" class="w100" src="https://thebook.io/img/007029/p079.jpg"/></div>
<p class="txts dl blue"><span class="dm bg_blue_line">그림 6-4</span> 주사위 시뮬레이션</p>
<p class="txts"> </p>
<p class="txt bl">주사위 시뮬레이션은 다음과 같은 과정으로 진행합니다.</p>
<p class="txtex bl"><span class="green">➊</span> 주사위를 굴린다.</p>
<p class="txtex bl"><span class="green">➋</span> 나온 결과를 기록한다.</p>
<p class="txtex bl"><span class="green">➌</span> <span class="green">➊</span>~<span class="green">➋</span> 과정을 n번 반복한다.</p>
<p class="txt bl"><span class="green">➍</span> 주사위의 눈이 나온 횟수를 히스토그램으로 그린다.</p>
