<p class="txtex bl"><span class="dm blue">2 |</span> 모든 역에 대해 시간대별 승차 인원과 하차 인원을 누적해서 더한다.</p>
<p class="txt bl"><span class="dm blue">3 |</span> 시간대별 승차 인원과 하차 인원을 그래프로 표현한다.</p>
