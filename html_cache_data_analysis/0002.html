<p class="txts"> </p>
<p class="txtex bl">여러분은 오늘 집을 나서기 전, 최고 기온 또는 최저 기온이 몇 도인지 확인했나요? 우리는 보통 뉴스나 앱을 통해 날씨와 기온을 확인한 뒤, 그에 따라 옷차림과 세차 여부, 약속 장소 등 다양한 선택을 합니다. 그렇다면 혹시 기상청에서 지역별 평균 기온과 최고 기온, 최저 기온이 기록된 데이터를 제공한다는 사실을 알고 있나요?</p>
<p class="txtex bl">이번 시간에는 기온 공공데이터를 어떻게 얻을 수 있는지 알아보고, 데이터 분석을 위한 환경을 설정하겠습니다.</p>
