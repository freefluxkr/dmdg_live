<p class="txt2 dm blue box_orange_line"><span class="bg_pink4">2</span> numpy 라이브러리 시작하기</p>
<p class="txt bl">먼저 간단한 함수부터 살펴보겠습니다. 다음 코드는 2의 제곱근(<span>)을 출력합니다.</span></p>
