<p class="txt2 dm blue box_orange_line"><span class="bg_pink4">3</span> 날짜 데이터 추출하기</p>
<p class="txt bl">파이썬이 제공하는 문자열 함수 중 <span class="cd">split()</span>는 사용자가 설정하는 특정 문자를 기준으로 문자열을 분리합니다. 다음 예시 코드를 볼까요?</p>
<div class="box_blue_line">
<pre>s <span class="violet">=</span> <span class="olive">'hello python'</span>
<span class="blue">print</span>(s.split())</pre>
</div>
<p class="txts"> </p>
<p class="txt dm"><span class="bg_pink6">실행 결과</span></p>
<div class="box_blue_line">
<pre>['hello', 'python']</pre>
</div>
<p class="txtex bl">코드를 실행하면 <span class="cd">['hello', 'python']</span>이라는 리스트가 출력됩니다. 여기서 알 수 있듯이 <span class="cd">split()</span> 함수는 사용자가 설정하는 특정 문자가 없다면 기본적으로 공백 문자를 기준으로 문자열을 분리합니다.</p>
