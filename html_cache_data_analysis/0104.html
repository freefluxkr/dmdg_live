<p class="txt bl">다음 그래프는 신도림동의 인구를 시각화한 것입니다. 그래프의 가로축은 나이, 세로축은 인구수를 의미합니다.</p>

<p class="txts"> </p>
<p class="txt bl">그래프를 보면 어렵지 않게 이 동네의 특성을 몇 가지 파악할 수 있습니다.</p>
<p class="txtex bl s10_08"><span class="blue">•</span> 30대 중후반 사람들이 많이 산다.</p>
<p class="txt bl s10_08"><span class="blue">•</span> 10세 이하의 아이가 10대 후반 청소년보다 많다.</p>
<p class="txtex bl">이 두 가지만으로도 ‘신도림에는 어린 아이를 키우는 3~40대 부부가 많겠구나’라고 생각할 수 있습니다.</p>
