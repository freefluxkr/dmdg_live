<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>마음 콕콕 다이어리 - 소원 나무</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue-50 text-gray-800 h-screen w-screen overflow-hidden flex flex-col select-none relative">
    
    <!-- Tree Background & Sticky Note Container -->
    <div id="tree-container" class="absolute inset-0 z-0">
        <!-- Background via CSS -->
    </div>

    <!-- Bottom Input Panel -->
    <div id="input-panel" class="absolute bottom-0 w-full bg-white/80 backdrop-blur-md border-t border-blue-200 p-6 z-20 rounded-t-3xl shadow-[0_-10px_30px_rgba(59,130,246,0.15)] transition-transform duration-500 transform translate-y-0">
        
        <h2 class="text-center text-blue-500 font-bold text-2xl mb-4">속상한 마음 털어놓기</h2>
        
        <div class="flex space-x-4 mb-4">
            <label class="cursor-pointer flex-shrink-0">
                <div id="photo-preview" class="w-20 h-20 border-2 border-dashed border-blue-300 bg-blue-50 flex items-center justify-center overflow-hidden rounded-xl">
                    <span id="photo-icon" class="text-blue-400 text-xs text-center font-bold">사진<br>올리기</span>
                    <img id="preview-img" class="hidden w-full h-full object-cover">
                </div>
                <input type="file" id="photo-upload" class="hidden" accept="image/*">
            </label>
            
            <div class="flex-grow space-y-2">
                <input type="text" id="target-name" placeholder="미운 사람 이름" class="w-full p-2 bg-white border border-blue-200 rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-300 text-sm">
                <textarea id="target-story" rows="2" placeholder="어떤 속상한 일이 있었나요?" class="w-full p-2 bg-white border border-blue-200 rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-300 text-sm resize-none"></textarea>
            </div>
        </div>
        
        <button id="start-btn" class="w-full py-3 bg-blue-400 text-white font-bold rounded-xl shadow-lg hover:bg-blue-500 transition-colors">나무에 붙이기</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
