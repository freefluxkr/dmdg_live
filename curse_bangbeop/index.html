<!DOCTYPE html>
<html lang="ko" class="theme-casual">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음 다이어리</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="transition-colors duration-700 ease-in-out min-h-screen flex items-center justify-center p-4">

    <!-- Secret Trigger -->
    <div id="secret-trigger" class="absolute top-4 left-4 w-12 h-12 rounded-full opacity-0 cursor-pointer z-50"></div>

    <div id="app-container" class="relative max-w-md w-full rounded-2xl shadow-2xl overflow-hidden glass-panel transition-all duration-700">
        
        <!-- Header -->
        <header class="p-6 text-center border-b transition-colors duration-700 header-border relative">
            <!-- Glitch Text hidden by default -->
            <h1 id="app-title" class="text-2xl font-bold transition-colors duration-700 relative z-10">감정 쓰레기통</h1>
            <p id="app-subtitle" class="text-sm mt-2 transition-colors duration-700 relative z-10">미운 마음을 털어놓고 홀가분해지세요.</p>
        </header>

        <!-- Form -->
        <main class="p-6 space-y-5 relative z-10">
            <!-- Photo Upload -->
            <div class="flex flex-col items-center">
                <label for="photo-upload" class="cursor-pointer group relative">
                    <div id="photo-preview" class="w-32 h-32 rounded-full border-4 border-dashed flex items-center justify-center overflow-hidden transition-all duration-500 preview-border bg-black/5 relative">
                        <i data-lucide="image-plus" id="photo-icon" class="w-8 h-8 text-gray-400"></i>
                        <img id="preview-img" src="" class="hidden w-full h-full object-cover">
                    </div>
                    <input type="file" id="photo-upload" class="hidden" accept="image/*">
                </label>
                <p id="photo-label" class="text-xs mt-2 transition-colors duration-700">대상의 사진 (선택)</p>
            </div>

            <!-- Name Input -->
            <div class="space-y-1">
                <label id="name-label" class="text-sm font-semibold transition-colors duration-700">이름</label>
                <input type="text" id="target-name" placeholder="누가 당신을 힘들게 했나요?" class="w-full p-3 rounded-lg border focus:outline-none focus:ring-2 transition-all duration-500 input-field">
            </div>

            <!-- Belonging/Story Input -->
            <div class="space-y-1">
                <label id="belonging-label" class="text-sm font-semibold transition-colors duration-700">속마음 이야기</label>
                <textarea id="target-belonging" rows="3" placeholder="그 사람에게 하고 싶은 말을 적어보세요..." class="w-full p-3 rounded-lg border focus:outline-none focus:ring-2 transition-all duration-500 input-field"></textarea>
            </div>

            <!-- Submit Button -->
            <button id="submit-btn" class="w-full py-4 rounded-xl font-bold text-lg shadow-lg transform transition-all duration-300 hover:scale-[0.98] active:scale-95 btn-style relative overflow-hidden">
                비워내기
            </button>
        </main>
        
        <!-- Glitch Overlay (Hidden by default) -->
        <div id="glitch-overlay" class="absolute inset-0 pointer-events-none opacity-0 transition-opacity duration-300 z-20"></div>
    </div>

    <!-- Instructions / Hint -->
    <div class="absolute bottom-4 left-4 text-xs text-gray-400 opacity-50 cursor-default pointer-events-none">
        Hint: 좌측 상단 모서리를 3번 클릭해보세요...
    </div>

    <script src="app.js"></script>
</body>
</html>
