<h1 class="page-subject">06장 파이썬 프로그래밍, 어떻게 시작해야 할까?</h1>
<hr class="title-divider"/>
<div class="page-content tex2jax_process book-content-font-large">
<p>06장에서는 짧은 스크립트와 함수들을 만들어 본다. 스크립트란 에디터로 작성한 파이썬 프로그램 파일을 말한다. 프로그래밍 감각을 키우는 데 좋은 재료가 될 것이다. 06장의 모든 예제는 대화형 인터프리터가 아닌 에디터로 작성해야 한다.</p>
