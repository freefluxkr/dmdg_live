<p>이 장에서는 MCP(Model Context Protocol)를 통해 Hermes Agent의 기능을 확장하는 방법을 다룹니다. 빌트인 도구(4장)와 스킬(7장)만으로 대부분의 작업이 가능하지만, CLI가 없는 외부 서비스와 연결하거나 여러 에이전트가 같은 도구를 공유해야 할 때 MCP가 필요합니다. 언제 MCP를 쓰고, 언제 다른 접근법이 나은지도 함께 다룹니다.</p>
