<p class="txt2 dm blue box_orange_line"><span class="bg_pink4">1</span> 막대그래프 그리기</p>
<p class="txtex bl">이렇게 인구 구조를 꺾은선 그래프로 표현하니 해당 지역에 어떤 연령의 사람들이 많고 적은지가 한눈에 들어옵니다. 만약 꺾은선 그래프가 아닌 다른 형태로 시각화하면 어떤 정보들을 새롭게 찾을 수 있을까요?</p>
<p class="txtex bl">예를 들어, 연령대가 같은 사람들의 정보로 그래프를 그린다면 지역에 따른 비교를 해 볼 수 있겠지요. 성별을 기준으로 그래프를 그린다면 지역별 성비도 확인할 수 있을 것입니다.</p>
<p class="txt bl">이번 시간에는 <span class="cd">bar()</span> 함수로 데이터를 표현하는 방법을 알아보겠습니다.</p>
