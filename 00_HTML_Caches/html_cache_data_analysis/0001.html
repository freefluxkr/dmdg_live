<h1 class="txtc dm"><span class="cap blue bg_white"><span class="pink">•</span> 첫째 마당 <span class="pink">•</span></span><br/>
  기온 공공데이터</h1>
<p class="box_blue_line2"> </p>
<p class="txt dm blue">여러분이 오늘 처음 만난 데이터는 무엇인가요? 오늘의 날씨, 도로 위 교통량, 미세먼지 농도 등 우리의 일상은 다양한 데이터로 가득 차 있습니다. 많은 사람이 함께 공유하는 날씨, 환율 등의 데이터뿐만 아니라 수면 시간, 운동 시간 같은 개인 기록도 데이터가 될 수 있습니다. 그중에서도 이 책에서 우리가 첫 번째로 다룰 데이터는 바로 기온 데이터입니다.</p>
