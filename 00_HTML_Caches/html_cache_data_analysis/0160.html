<p class="txt bl"><span class="cd">scatter()</span> 함수는 버블 차트를 그릴 때도 사용할 수 있습니다. <span class="cd">scatter()</span> 함수로 버블 차트를 나타내려면 기존 코드에서 <span class="cd">size</span>를 의미하는 <span class="cd">s</span> 속성을 추가하고 원하는 크기를 입력합니다. 간단하죠?</p>
<div class="box_blue_line">
<pre><span class="violet">import</span> matplotlib.pyplot as plt
plt.scatter([<span class="blue2">1</span>,<span class="blue2">2</span>,<span class="blue2">3</span>,<span class="blue2">4</span>], [<span class="blue2">10</span>,<span class="blue2">30</span>,<span class="blue2">20</span>,<span class="blue2">40</span>], <span class="cd2">s<span class="violet">=</span>[<span class="blue2">100</span>,<span class="blue2">200</span>,<span class="blue2">250</span>,<span class="blue2">300</span>]</span>)
plt.show()</pre>
