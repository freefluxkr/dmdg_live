<p class="txt1 dm"><span class="cap blue">■</span> bar( ) 함수</p>
<p class="txtex bl"><span class="cd">bar()</span> 함수는 막대그래프를 표현하는 명령어입니다. 막대그래프에서 막대의 길이는 각 데이터의 크기를 의미합니다.</p>
<p class="txt bl">다음은 간단한 막대그래프의 예시 코드입니다.</p>
<div class="box_blue_line">
<pre><span class="violet">import</span> matplotlib.pyplot as plt
plt.bar([<span class="blue2">0</span>, <span class="blue2">1</span>, <span class="blue2">2</span>, <span class="blue2">4</span>, <span class="blue2">6</span>, <span class="blue2">10</span>], [<span class="blue2">1</span>, <span class="blue2">2</span>, <span class="blue2">3</span>, <span class="blue2">5</span>, <span class="blue2">6</span>, <span class="blue2">7</span>])
plt.show()</pre>
