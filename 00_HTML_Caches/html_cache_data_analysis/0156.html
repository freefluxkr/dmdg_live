<p class="txt2 dm blue box_orange_line"><span class="bg_pink4">3</span> 산점도로 표현하기</p>
<p class="txtex bl">이번에는 데이터 간의 관계를 파악하는 데 도움이 되는 산점도를 그려보고자 합니다. 산점도는 가로축과 세로축을 기준으로 두 요소가 서로 어떤 관계를 맺고 있는지를 파악하기 쉽게 나타낸 그래프입니다.</p>
<p class="txt bl">예를 들어, 가로축을 제주도 지역의 남성 인구수, 세로축을 제주도 지역의 여성 인구수라고 설정합니다. 두 요소를 기준으로 그린 산점도는 남성 인구수와 여성 인구수 사이에 어떤 관계가 있는지 파악하기 쉽습니다.</p>
