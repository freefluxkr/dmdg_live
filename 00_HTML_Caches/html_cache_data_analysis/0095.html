<p class="box_blue_line2"> </p>
<p class="txt dm blue">지금까지는 기온 공공데이터를 바탕으로 데이터에 질문을 던지고, 질문을 다듬고, 문제를 해결하는 과정을 정리하고, 이를 파이썬 코드로 구현하였습니다. 이제 어느 정도 데이터 분석에 대한 감이 잡혔나요? 앞서 기온 공공데이터를 활용해서 다양한 분석을 했던 것처럼, 셋째 마당에서는 인구 공공데이터를 바탕으로 다양한 궁금증을 해결해 보겠습니다.</p>
