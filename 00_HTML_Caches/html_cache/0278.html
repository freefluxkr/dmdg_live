<p class="txt bl"><span class="cd">date</span>에는 하이픈(<span class="cd">-</span>)이 2개 있어서 하이픈을 기준으로 나누면 세 부분으로 나뉩니다. 공백을 기준으로 나눴을 때처럼 하이픈은 사라지고 연, 월, 일 숫자만 결과 리스트에 들어갑니다.</p>
<p class="txt bl">이번에는 인덱스를 사용해 연, 월, 일을 각각 출력해 봅시다.</p>
<div class="highlight">
<pre>date = <span class="red2">'2021-04-15'</span>
<span class="gold">print</span>(date.split(<span class="red2">'-'</span>)<span class="cd2">[</span><span class="cd2 green">0</span><span class="cd2">]</span>)
<span class="cd2 gold">print</span><span class="cd2">(date.split(</span><span class="cd2 red2">'-'</span><span class="cd2">)[</span><span class="cd2 green">1</span><span class="cd2">])</span>
<span class="cd2 gold">print</span><span class="cd2">(date.split(</span><span class="cd2 red2">'-'</span><span class="cd2">)[</span><span class="cd2 green">2</span><span class="cd2">])</span></pre>
</div>
<div class="highlight4">
<pre><span class="bg_brown3">실행결과</span>
2021 
04
15</pre>
</div>
<p class="txt bl">코드가 중복되긴 하지만, 인덱스를 일일이 세지 않아도 돼서 편합니다.</p>
</div>
