<h2 class="txt3 dm"><span class="brown">15장</span><br/>
      프로그램 화면 구성하기: tkinter</h2>
<p class="txts"> </p>
<p class="txts"> </p>
<p class="txts"> </p>
<p class="txt bl">마지막 장에서는 프로그램의 화면을 구성합니다. <span class="cd">tkinter</span>라는 패키지를 활용하는데, 유의할 점이 하나 있습니다. <span class="cd">tkinter</span> 화면은 서버가 구성된 곳에서만 실행결과를 확인할 수 있습니다. 주피터 노트북은 로컬 PC를 서버로 사용하지만, 구글 코랩은 구글 클라우드에서 돌아가므로 서버를 구성할 수 없습니다. 따라서 지금까지 코랩에서 프로그램을 작성했더라도 이 장에서는 <span class="dm">주피터 노트북을 사용하길 추천</span>합니다.</p>
