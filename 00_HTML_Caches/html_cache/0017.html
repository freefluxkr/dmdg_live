<p class="txtex dm">주피터 노트북(아나콘다) 설치하기</p>
<p class="txt bl">프로그래밍하다 보면 라이브러리 설치가 까다롭고 귀찮은 경우가 많습니다. 이런 불편함을 제거해 간편하게 프로그래밍할 수 있게 돕는 것이 바로 아나콘다입니다. 아나콘다<span class="txts gray">(Anaconda)</span>는 파이썬과 함께 파이썬에서 자주 활용하는 주요 라이브러리를 설치해 줍니다. 주피터 노트북도 아나콘다를 설치하면 함께 설치됩니다.</p>
