<h4 class="txt1 dm" id="sigil_toc_id_56"><span class="yellow">6.3.3</span> 이차원 리스트로 간단한 프로그램 만들기</h4>
<p class="txt bl">그럼 이차원 리스트는 언제, 어떻게 쓰일까요? 사실 일상생활에는 이차원 리스트가 정말 많습니다. 표로 표현되는 것은 대부분 이차원 리스트로 작성할 수 있습니다. 표는 데이터가 잘 정리되고 구조화된 형태입니다. 우리는 하루에도 몇 번씩 표를 봅니다. 뉴스에서 흔하게 접할 수 있고 게임에서도 플레이어들의 랭킹 순위를 표 형태로 제공합니다. 다음 제시된 카드 내역도 표입니다.</p>
