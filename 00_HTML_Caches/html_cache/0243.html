<h4 class="txt1 dm" id="sigil_toc_id_45"><span class="yellow">6.1.1</span> 리스트란</h4>
<p class="txt bl">여러분이 월별 지출을 정리하는 가계부 프로그램을 만든다고 가정해 봅시다. 지출을 월별로 저장해야 하므로 지금까지 배운 대로 한다면 다음처럼 12개의 변수가 필요하겠죠.</p>
<div class="highlight">
<pre>jan = <span class="green">25</span>
feb = <span class="green">36</span>
...
nov = <span class="green">40</span>
dec = <span class="green">25</span></pre>
</div>
<p class="txt bl">변수가 12개라서 적어 보일 수 있지만, 매일 지출을 정리한다면 어떨까요? 365개의 변수를 만들어야 합니다. 코드로 작성하기가 만만치 않습니다. 어떻게 해야 많은 데이터를 좀 더 효율적으로 다룰 수 있을까요?</p>
