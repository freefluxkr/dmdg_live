<p class="txt bl">두 번째 단계인 프로젝트 구현으로 들어가 보겠습니다. 하위 목표 4가지의 알고리즘을 작성하고 코드로 구현해야죠. 하위 목표를 코드로 구현하기 전에 먼저 해야 할 작업이 있습니다. 내려받은 데이터를 프로그램에서 사용하려면 파이썬 파일에서 읽어 들여야 합니다. 그리고 앞에서 언급했듯이 행정동명에 해당하는 행정동코드를 알아내야 합니다. 그럼 2가지 작업부터 진행해 보겠습니다.</p>
