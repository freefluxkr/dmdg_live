<p class="txt bl">프로그램의 기본 요소인 입출력 명령어와 데이터를 저장하는 변수를 배웠습니다. 또 하나 배운 것이 있죠. 바로 제어구조입니다. 제어구조는 ‘프로그램의 흐름 즉, 여러 개의 명령어가 있을 때 실행되는 순서’라고 했습니다. 제어구조에는 총 세 가지가 있는데, 그중에서 가장 기본인 순차구조만 배웠습니다. 순차구조는 위에서 아래로 순서대로 진행되는 구조입니다. 순차구조는 간단해서 쉽게 이해했을 겁니다.</p>
<p class="txt bl">그럼 이 장에서는 두 번째 제어구조인 선택구조를 배워 보겠습니다.</p>
