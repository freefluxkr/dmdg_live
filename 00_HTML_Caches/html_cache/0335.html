<p class="txtex dm">키-값 삭제하기</p>
<p class="txt bl">마지막으로 딕셔너리에서 키-값 쌍을 삭제하는 방법을 알아봅시다. 리스트에서 데이터를 삭제할 때 <span class="cd">del</span>을 사용했습니다. 딕셔너리에서도 <span class="cd">del</span>을 사용합니다.</p>
<p class="txts dm"><span class="bg_yellow">형식</span></p>
<div class="highlight2">
<pre><span class="purple">del</span> 딕셔너리명[키]</pre>
</div>
<p class="txt bl"><span class="cd">del</span> 뒤에 삭제할 키를 적어주면 해당 키-값 쌍이 삭제됩니다.</p>
<div class="highlight">
<pre>menu = {<span class="red2">'김밥'</span>: <span class="green">2500</span>, <span class="red2">'참치김밥'</span>: <span class="green">3500</span>, <span class="red2">'라면'</span>: <span class="green">3000</span>, <span class="red2">'치즈라면'</span>: <span class="green">4000</span>}
<span class="cd2 purple">del</span> <span class="cd2">menu[</span><span class="cd2 red2">'치즈라면'</span><span class="cd2">]</span>
<span class="gold">print</span>(menu)</pre>
</div>
<div class="highlight4">
<pre><span class="bg_brown3">실행결과</span>
{'김밥': 2500, '참치김밥': 3500, '라면': 3000}</pre>
</div>
</div>
