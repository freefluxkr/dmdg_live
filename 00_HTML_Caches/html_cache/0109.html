<p class="txt bl">그러면 3.2.2 <span class="dm">초보자가 겪는 흔한 오류</span>에서 본 두 가지 오류를 고치려면 어떻게 해야 할까요?</p>
<p class="txt bl">첫 번째 오류는 문자와 숫자 사이에 +를 사용할 수 없는 오류였죠. 해결 방법은 두 가지입니다. 문자를 숫자로 바꾸거나 숫자를 문자로 바꾸는 방법입니다.</p>
<p class="txtex dm ind10">수정 전 코드</p>
<div class="highlight3">
<pre><span class="gold">print</span>(<span class="red2">'123'</span> + <span class="green">2</span>)</pre>
</div>
<p class="txtex dm ind10">수정 후 코드</p>
<div class="highlight3">
<pre><span class="gold">print</span>(<span class="red2">'123'</span> + <span class="red2">'2'</span>)
<span class="green"># 또는</span>
<span class="gold">print</span>(int(<span class="red2">'123'</span>) + <span class="green">2</span>)</pre>
</div>
<div class="highlight4">
<pre><span class="bg_brown3">실행결과</span>
1232
125</pre>
</div>
</div>
