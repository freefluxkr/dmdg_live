<h4 class="txt1 dm" id="sigil_toc_id_94"><span class="yellow">11.2.5</span> 하위 목표 4 - 다른 지역과 인구 비교 분석하기</h4>
<p class="txt bl">마지막 하위 목표를 작성해 봅시다. 지금까지는 인구의 절대치로만 그래프를 그렸기 때문에 실제로 어느 정도 붐비는지 실감나지 않습니다. 이를 위해 잘 아는 지역과 핫플레이스가 있는 지역의 인구 그래프를 비교해 보겠습니다. 목표 수립 단계에서 ‘핫플레이스가 있는 행정동과 익숙한 행정동의 시간대별 평균인구 그래프를 그려 비교 분석하기’로 하위 목표를 잡았습니다.</p>
