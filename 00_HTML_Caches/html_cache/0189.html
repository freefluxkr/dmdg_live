<p class="txt bl">먼저, 출력할 단을 <span class="cd">input()</span>으로 입력받습니다. 3장에서 배웠듯이 <span class="cd">input()</span>은 입력받는 값을 문자열로 취급하니 전체를 <span class="cd">int()</span>로 다시 감쌉니다. 앞에서 작성한 1부터 50까지 숫자 곱 구하기 코드를 참고하면 반복 범위는 <span class="cd">for i range(1, 10)</span>으로 작성할 수 있습니다. 그다음 줄에 반복문 내부에서 반복할 명령어를 들여쓰기로 입력합니다. 우리가 원하는 결과는 다음처럼 구구단을 출력하는 겁니다. 결과에서 변하지 않는 부분은 그대로 문자열로 출력하고, 변하는 부분은 변수를 활용합니다.</p>
