<p class="txt bl">3번째 글자까지 슬라이싱이 잘 됐습니다. 이번에는 ‘우주최강’을 슬라이싱해 봅시다. 뒤에서 네 글자만 골라내면 됩니다. 뒤에서부터 세므로 음수 인덱스를 사용해 <span class="cd">a[-4:]</span>로 작성하면 됩니다.</p>
<div class="ind12"><img alt="" class="w60" src="https://thebook.io/img/080251/236_2.jpg"/></div>
<p class="txts"> </p>
<div class="highlight">
<pre><span class="gold">print</span>(a[<span class="cd2 green">-4</span>:])</pre>
</div>
<div class="highlight4">
<pre><span class="bg_brown3">실행결과</span>
우주최강</pre>
</div>
<p class="txt bl">이번에는 ‘우주’만 뽑아봅시다. 어떻게 하면 될까요? 책을 보고 그대로 작성하기 전에 스스로 생각해 봅시다! 그다음 코드를 작성하고 자신의 생각이 맞는지 책을 확인하세요.</p>
<div class="highlight">
<pre><span class="gold">print</span>(a[<span class="green">-4</span>:<span class="cd2 green">-2</span>])</pre>
</div>
<div class="highlight4">
<pre><span class="bg_brown3">실행결과</span>
우주</pre>
</div>
</div>
