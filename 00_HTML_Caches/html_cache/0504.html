<p class="txt bl">여러분이 여행을 떠난다고 한번 생각해 봅시다. 무작정 떠나는 여행도 설레고 즐겁지만, 시간과 비용이 아깝지 않은 여행이 되려면 아무래도 여행 계획을 미리 짜는 게 좋겠죠. 그래서 보통 여행을 가기 전에 여행 계획을 세웁니다. 그리고 계획에 맞춰 실제 여행하고 돌아와서는 비용을 정산하고 짐을 정리하며 여행을 마무리합니다. 이런 여행 과정을 단계별로 나눠 보면 다음과 같습니다.</p>
