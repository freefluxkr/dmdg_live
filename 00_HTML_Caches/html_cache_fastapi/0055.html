<h3 class="txt1 dm" id="sigil_toc_id_13"><span class="purple">1.4.4</span> 가상환경 만들기</h3>
<p class="txt bl"><span class="dm">가상환경</span><span class="txts gray">(virtual environment)</span>이란 프로젝트별로 독립된 패키지 설치 공간을 제공하는 격리된 환경을 말합니다. 가상환경을 사용하면 프로젝트마다 필요한 패키지 버전을 별도로 관리할 수 있어 다른 프로젝트와의 충돌을 방지하고 안정적인 개발 환경을 유지할 수 있습니다. 가상환경 생성과 활성화는 파이썬 내장 모듈 <span class="cd">venv</span>를 사용합니다.</p>
