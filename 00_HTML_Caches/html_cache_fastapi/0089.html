<p class="txt bl"><span class="dm">경로</span><span class="txts gray">(path)</span>는 클라이언트가 서버로 요청을 보내는 주소로, 서버의 기본 주소(http://127.0.0.1:8000) 뒤에 붙는 주소를 말합니다. 예를 들어 http://127.0.0.1:8000/login이라는 주소가 있다면 /login이 경로에 해당하며, 이 경로를 통해 클라이언트의 요청이 서버로 전달됩니다.</p>
