<h3 class="txt1 dm" id="sigil_toc_id_19"><span class="purple">2.2.3</span> 엔드포인트</h3>
<p class="txt bl">지금까지 경로를 이용해 요청을 보내고 응답을 받는 방법, 경로 변수를 이용해 동적 경로를 구성하는 방법을 익혔습니다. API는 이렇게 클라이언트가 정해진 규칙(경로, 메서드, 데이터 형식)에 따라 요청을 보내고, 서버가 이를 처리해 응답하는 약속된 방식을 말합니다.</p>
<p class="txt bl">API는 문맥에 따라 두 가지 의미로 사용됩니다. 넓은 의미의 API는 서비스가 외부에 제공하는 기능 전체를 뜻하며, 좁은 의미의 API는 특정 기능을 수행하는 개별 요청을 뜻합니다. 이 책에서는 지금부터 좁은 의미의 API로 사용합니다.</p>
