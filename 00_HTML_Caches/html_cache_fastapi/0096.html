<h3 class="txt1 dm" id="sigil_toc_id_18"><span class="purple">2.2.2</span> 경로 변수</h3>
<p class="txt bl"><span class="cd">/login</span>은 경로 자체가 고정된 <span class="dm">정적 경로</span><span class="txts gray">(static path)</span>입니다. FastAPI는 경로의 일부를 바꿔 처리할 수 있는 <span class="dm">동적 경로</span><span class="txts gray">(dynamic path)</span>를 지원하는데, 여기서 동적<span class="txts gray">(dynamic)</span>이라는 말은 경로의 일부가 고정된 값이 아니라 요청할 때마다 달라질 수 있다는 뜻입니다. 예를 들어 사용자 아이디에 따라 해당 사용자 정보만 보여 주고 싶다면 경로를 <span class="cd">/users/{user_id}</span>와 같이 정의합니다.</p>
