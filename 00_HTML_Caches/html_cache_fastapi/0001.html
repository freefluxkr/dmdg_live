      FastAPI 소개</h1>
</div>
<p class="txt dl">이 장에서는 파이썬 기반의 웹 프레임워크인 FastAPI를 소개합니다. FastAPI가 등장한 배경과 핵심 특징을 정리하고 Flask(플라스크), Django(장고) 같은 다른 프레임워크와 비교해 어떤 점에서 다른지 확인합니다. 또한 FastAPI의 기술적 특성이 개발 생산성과 코드 품질에 어떤 영향을 주는지 살펴보고 이 책의 실습을 위해 FastAPI 개발 환경을 설정합니다.</p>
