<div class="box_purple_line"></div>
<p class="txt bl">FastAPI에서 Fast는 두 가지 의미를 가집니다. 첫 번째는 개발 속도가 빠르다는 의미의 <span class="dm">Fast to code</span>이고, 두 번째는 실행 속도가 빠르다는 의미의 <span class="dm">Fast to run</span>입니다. 이러한 속도를 가능하게 하는 FastAPI의 대표적인 특징을 살펴보겠습니다.</p>
