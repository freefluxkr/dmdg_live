<h2>8.2 Fast-Forward 병합</h2>
<p class="x00--">깃의 가장 간단한 브랜치 병합은 <span class="A------">Fast</span><span class="x-----">-</span><span class="A------">Forward</span> 방식입니다. 영어 표현을 풀어 쓰면 <span class="x3---------">빨리 감기</span>라고 할 수 있습니다. 일반적으로 <span class="A------">Fast</span><span class="x-----">-</span><span class="A------">Forward</span> 병합 방식은 혼자 개발할 때 사용합니다. </p>
<p class="x00--"><span>혼자 개발할 때는 브랜치가 생성된 커밋에 따라 순차적으로 분기됩니다. 또 코드 수정도 순차적으로 할 때가 많습니다. 즉, 브랜치가 분기되지만 전체 커밋 그림으로 보면 모든 변경 사항은 순차적으로 진행됩니다. 이러한 순차적 커밋에 맞추어 병합을 처리하는 방법이 </span><span class="A------">Fast</span><span class="x-----">-</span><span class="A------">Forward</span><span> 병합입니다.</span></p>
