<h3>7.1.9 소스트리에서 스태시 사용</h3>
<p class="x00--">먼저 소스트리의 새 탭에서 <span class="A------ x3---------">Add</span> 버튼을 클릭합니다. <span class="x3---------">탐색</span>을 눌러 앞에서 만든 <span class="A------">gitstudy</span><span class="A------">07</span> 폴더를 찾아 선택한 후 <span class="x3---------">추가</span>를 누릅니다. 그러면 <span class="A------">gitstudy</span><span class="A------">07</span> 저장소와 연결됩니다. </p>
<p class="x00--">소스트리에서는 코드 파일을 수정한 후 커밋하지 않은 내용이 있는 상태가 되면 자동으로 <span class="x3---------">스태시</span><span><span><img alt="7-a.jpg" class="frame-186" src="https://thebook.io/img/080212/7-a_fmt.jpeg"/></span></span> 버튼이 활성화됩니다. 다음과 같이 왼쪽에서 <span class="A------ x3---------">feature</span> 브랜치를 선택하면 아래쪽에서 자세한 설명을 볼 수 있습니다. <span class="x3---------">스태시</span> 버튼을 클릭합니다.</p>
