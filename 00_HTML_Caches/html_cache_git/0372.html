<h2>8.5 충돌</h2>
<p class="x00--">실습을 그대로 따라 했다면 모든 병합을 성공적으로 처리했을 것입니다. 하지만 실제 개발 환경에서는 실습과 달리 다양한 문제가 발생합니다. 대표적으로 여러 사람과 개발한 코드 일부분이 충돌<span class="x3------">(</span><span class="A------ x3------">complicit</span><span class="x3------">)</span>하는 경우입니다. 보통 충돌은 <span class="A------">3</span><span class="x-----">-</span><span class="A------">way</span> 병합이 실패한 경우입니다.</p>
