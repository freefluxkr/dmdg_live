<h3>2.1.1 윈도에서 설치</h3>
<p class="x00--">마이크로소프트의 윈도는 전 세계적으로 가장 많이 사용하는 운영 체제입니다. 윈도 운영 체제에서 깃을 설치하는 방법을 알아봅시다.</p>
<p class="x03---">설치 파일 내려받기</p>
<p class="x00--">깃 공식 사이트(<a href="https://git-scm.com" target="_blank">https://git-scm.com</a>)에 접속하여 윈도용 설치 파일을 내려받겠습니다. 웹 사이트 오른쪽 아래에 위치한 설치 파일을 클릭하여 내려받습니다. 설치 파일 내려받기가 완료되면 윈도의 다운로드 폴더에 저장됩니다.</p>
