<h2>10.9 태그 공유</h2>
<p class="x00--">지금까지는 로컬 저장소에서 태그를 생성하는 방법을 알아보았습니다. 로컬 저장소에서 생성한 태그를 원격 저장소로 공유할 수 있습니다. 태그는 불특정 다수에게 최종 소스의 커밋 정보를 알리려고 공유하는 것입니다. 즉, 태그를 공유하는 것은 최종 코드를 배포하는 것과 같습니다. 태그를 사용하여 사용자는 최종 코드를 내려받을 수 있습니다.</p>
