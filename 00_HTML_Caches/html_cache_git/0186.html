<h3>5.2.2 저장소 생성</h3>
<p class="x00--">깃허브에 새로운 저장소를 생성하는 방법을 알아보겠습니다. <span class="x3---------">공개용 저장소</span>로 생성하여 실습할 것입니다. 공개된 저장소는 무제한으로 생성해서 사용할 수 있습니다. 비공개용은 제약이 조금 있고, 일부는 유료 서비스입니다.</p>
<p class="x00--">로그인한 상태에서 새로운 저장소를 생성합시다. 대시보드에서 <span class="A------ x3---------">New</span> 버튼을 클릭하거나 <span class="x3---------">+ </span><span class="x3--------- char-style-override-27">&gt;</span><span class="x3---------"> </span><span class="A------ x3---------">New</span><span class="x3---------"> </span><span class="A------ x3---------">repository</span>를 선택합니다.</p>
