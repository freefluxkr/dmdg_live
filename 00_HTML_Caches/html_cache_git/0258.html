<h3>6.7.3 소스트리 HEAD</h3>
<p class="x00--">소스트리에서도 <span class="A------">HEAD</span> 포인트 상태를 쉽게 확인할 수 있습니다. 각 브랜치의 마지막 위치를 <span class="x3---------">브랜치 아이콘</span>으로 표시합니다. 예를 들어 각 브랜치마다 마지막 커밋을 <span class="A------">HEAD</span> 포인트로 표시합니다.</p>
<p class="fcap">▼ 그림 6- 11 소스트리에서의 HEAD</p>
