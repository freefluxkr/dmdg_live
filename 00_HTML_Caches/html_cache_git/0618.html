<h2>12.8 정리</h2>
<p class="x00--">일반적인 사용자는 깃의 고급 기능까지 알 필요가 없습니다. 하지만 자신이 프로젝트에서 중요한 자리를 맡았거나 저장소를 운영한다면 좀 더 많은 기능을 알고 있는 것이 좋습니다. 깃의 고급 기능을 이용하면 협업할 때 발생하는 저장소 문제들을 복구하고 해결할 수 있습니다. </p>
