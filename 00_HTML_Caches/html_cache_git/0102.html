<h2>정리</h2>
<p class="x00--">이 장에서는 깃 저장소와 <span class="x3---------">저장소 개념</span>을 학습했습니다. 앞으로 깃을 학습하려면 이 장에서 배운 저장소 개념을 잘 알고 있어야 합니다. 또 각 용어들을 구분하고 이해하는 것도 필요합니다(특히 워킹 디렉터리와 스테이지 영역). 각 장의 기능을 학습하다 용어 이해가 부족하다고 느낄 때 이 장을 다시 읽어 보는 것도 좋습니다.</p>
