<h2>10.4 태그 목록</h2>
<p class="x00--">태그 기능을 본격적으로 학습하기에 앞서 간단히 태그 명령어를 알아봅시다. 태그를 사용하려면 <span class="A------ x3-------1">tag</span> 명령어를 사용합니다. 단독으로 실행할 수도 있고, 옵션을 추가할 수도 있습니다. </p>
<div class="frame-62">
<p class="N------2 para-style-override-39">$ git tag</p>
</div>
<p class="x00--">옵션은 <span class="x----- x3-------1">-</span><span class="A------ x3-------1">l</span> 또는 <span class="x----- x3-------1">--</span><span class="A------ x3-------1">list</span> 옵션을 같이 사용합니다. </p>
<p class="lbl"><span class="ex">예</span></p>
<pre><code><p class="N---- para-style-override-14">$ <span class="x--">git tag -l</span></p></code></pre>
<section class="tipbox">
<header><span class="type">Note</span> <span class="title"></span></header>
<hr/>
<p class="x07----- para-style-override-31">소스트리에서는 생성된 태그 목록을 좀 더 쉽게 확인할 수 있습니다. 화면 왼쪽에 <span class="x-----2">태그</span> 탭을 표시하는데, <span class="x-----2">태그</span> 탭을 선택해서 확장하면 생성된 모든 태그 목록을 확인할 수 있습니다.</p>
