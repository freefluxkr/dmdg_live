<h3>6.3.3 소스트리 브랜치</h3>
<p class="x00--">이번에는 소스트리로 새로운 브랜치를 하나 생성해 보겠습니다. 소스트리의 새 탭에서 <span class="A------ x3---------">Add</span> 버튼을 클릭합니다. <span class="x3---------">탐색</span>을 눌러 앞에서 만든 <span class="A------">gitstudy</span><span class="A------">06</span> 폴더를 찾아 선택한 후 <span class="x3---------">추가</span>를 누릅니다. 그러면 <span class="A------">gitstudy</span><span class="A------">06</span> 저장소와 연결됩니다. </p>
<p class="x00--">소스트리의 왼쪽에서 <span class="x3---------">브랜치</span> 탭을 확인할 수 있습니다. 브랜치에 모든 브랜치 목록이 같이 출력됩니다. </p>
