<h2>11.3 서브모듈 추가</h2>
<p class="x00--">두 저장소를 생성하고 원격 저장소와 연결하여 서브모듈 실습 환경을 준비했습니다. <span class="x3---------">서브모듈은 <br/></span><span class="A------ x3---------">2</span><span class="x3---------">개 이상인 저장소를 부모와 자식 관계로 연결</span>합니다.</p>
<p class="x00--">저장소를 모듈로 연결하려면 <span class="A------ x3-------1">submodule</span> 명령어를 사용합니다.</p>
<div class="frame-62">
<p class="N------2 para-style-override-39">$ git submodule -help</p>
</div>
<p class="x00--"><span class="A------ x3-------1">submodule</span> 명령어는 옵션을 사용하여 다양한 동작을 실행할 수 있습니다. 자세한 옵션은 <span class="x----- x3-------1">-</span><span class="A------ x3-------1">help</span><span class="x3-------1"> </span>명령어로 확인합니다.</p>
</div>
