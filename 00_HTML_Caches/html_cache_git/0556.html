<h2>11.8 정리</h2>
<p class="x00--"><span>서브모듈은 규모가 큰 저장소를 작은 저장소 여러 개로 분리하여 운영할 수 있게 합니다. 또 서브모듈은 큰 프로젝트를 쪼개서 작은 프로젝트로 만들고, 저장소 크기를 줄여 가볍게 저장소를 운영할 수도 있습니다. 서브모듈 형태로 코드를 분리하면 다른 프로젝트에서도 모듈을 재사용할 수 있는 장점이 있습니다. 또 각 모듈을 원격 저장소와 연결해서 협업하여 개발을 진행할 수도 있습니다.</span></p>
