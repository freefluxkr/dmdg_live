<h2>1.4 깃의 동작 한눈에 보기</h2>
<p class="x00--">앞으로 깃의 다양한 동작을 살펴볼 것입니다. 깃은 크게 다섯 단계로 진행됩니다.</p>
<p class="x00-- para-style-override-16"><span> </span></p>
<p class="fcap">▼ 그림 1-4 깃의 다섯 단계</p>
<img alt="270583.png" class="frame-17" src="https://thebook.io/img/080212/270583.png"/>
<ul>
<li class="x06----"><span class="x3---------">초기화</span>: 폴더를 깃 저장소로 변경합니다.</li>
<li class="x06----"><span class="x3---------">커밋</span>: 변경된 코드의 이력을 기록합니다.</li>
<li class="x06----"><span class="x3---------">브랜치</span>: 분리 격리된 코드 이력을 기록합니다.</li>
<li class="x06----"><span class="x3---------">병합</span>: 기존 이력과 분리된 이력을 통합합니다.</li>
<li class="x06---- para-style-override-28"><span class="x3---------">푸시</span>: 로컬 저장소의 이력을 서버로 전송 및 공유합니다.</li>
</ul>
<p class="x00--">다음 장부터 각 단계를 순차적으로 학습할 것입니다.</p>
