<h2>4.7 메시지가 없는 빈 커밋</h2>
<p class="x00--">커밋을 할 때는 반드시 커밋 메시지를 같이 작성해야 합니다. 하지만 의미가 없는 커밋이라 커밋 메시지를 생략하고 싶을 때도 있습니다. 이러한 특별한 상황에 대비하여 깃은 메시지가 없는 커밋 작성도 허용합니다. 이를 간단히 ‘빈 커밋’이라고 합니다. 빈 커밋 작성 방법은 지금까지 살펴본 메시지 작성 방법과 약간 다릅니다.</p>
