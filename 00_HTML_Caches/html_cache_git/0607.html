<h3>12.7.2 활성화</h3>
<p class="x00--">기본적으로 <span class="A------">rerere</span> 기능은 활성화되어 있지 않습니다. 이 기능을 사용하려면 다음 명령어로 활성화해야 합니다. </p>
<div class="frame-62">
<p class="N------2 para-style-override-39">$ git config rerere.enabled true</p>
</div>
<p class="x00--">로컬의 전체 저장소에 모두 적용하고자 한다면 <span class="x----- x3-------1">--</span><span class="A------ x3-------1">global</span> 옵션을 같이 사용합니다. 단일 저장소에서만 <span class="A------">rerere</span> 기능을 활성화할 때는 글로벌 옵션을 제외합니다. 환경 설정으로 활성화하면 저장소에서 <span class="A------">rerere</span> 기능을 사용할 수 있습니다.</p>
</div>
