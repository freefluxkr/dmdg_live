<h3>6.5.3 소스트리</h3>
<p class="x00--">소스트리에서 브랜치를 변경해 볼까요? 소스트리의 왼쪽에서 변경하고 싶은 브랜치를 선택합니다. 필자는 <span class="A------">master</span> 브랜치를 선택하겠습니다. 브랜치를 선택한 상태에서 마우스 오른쪽 버튼을 누릅니다. 다음 화면이 나오면 <span class="x3---------">체크아웃 </span><span class="A------ x3---------">master</span><span class="x3---------">...</span> 메뉴를 선택하여 <span class="A------">master</span> 브랜치로 변경합니다.</p>
