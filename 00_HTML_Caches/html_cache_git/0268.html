<h2>6.9 원격 브랜치</h2>
<p class="x00--">깃은 다수의 개발자와 협업으로 코드를 유지할 수 있습니다. 주요 개발 작업들은 로컬 저장소에서 하지만 협업은 원격 저장소도 공유합니다. </p>
<p class="x00--">로컬 저장소도 하나의 저장소고, 원격 저장소도 하나의 저장소입니다. 깃은 분산형 버전 관리로서 다수의 저장소를 만들어 연결할 수 있기 때문입니다. 이번에는 브랜치를 이용하여 협업하는 방법을 알아봅니다.</p>
<section class="tipbox">
<header><span class="type">Note</span> <span class="title"></span></header>
<hr/>
<p class="x07----- para-style-override-31"><span>원격 브랜치 실습을 하려면 원격 저장소가 필요합니다. 원격 저장소는 </span><span class="x100 x100">5</span><span>장에서 설명한 깃허브를 이용합니다. </span></p>
