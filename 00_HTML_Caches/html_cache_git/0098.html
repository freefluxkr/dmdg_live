<h2>3.6 깃 저장소 복제</h2>
<p class="x00--">초기화 명령(<span class="A------ x3-------1">git</span><span class="x3-------1"> </span><span class="A------ x3-------1">init</span> 명령어)은 새 저장소를 생성하는 방법 중 하나입니다.<span class="x8-----"><a class="footnote-link" href="https://thebook.io/080212/0102/#footnote-274722-1" id="footnote-274722-1-backlink">1</a></span> 처음 프로젝트를 시작할 때는 직접 로컬 컴퓨터에 명령어를 실행하여 저장소를 생성합니다. </p>
<p class="x00--">외부에 있는 기존 프로젝트(깃허브, 비트버킷)를 기반으로 저장소를 생성하고 싶다면 어떻게 해야 할까요? 외부 저장소를 복제해서 생성할 수 있습니다. 이처럼 외부 저장소를 이용하여 로컬 저장소를 생성하는 것을 ‘깃 저장소 복제’라고 합니다.</p>
