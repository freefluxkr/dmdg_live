<p class="x00--">상태 개념은 깃의 분리된 저장 영역인 워킹 디렉터리와 스테이지, 추적 여부를 의미합니다. 깃이 이렇게 다양한 저장 영역을 구분해서 가지고 있는 것은 파일들의 상태를 효율적으로 모니터링하기 위해서입니다. 이번에는 파일들의 상태를 모니터링할 수 있는 <span class="A------ x3-------1">status</span> 명령어를 알아봅니다.</p>
