<h3>2.4.5 소스트리의 환경 설정</h3>
<p class="x00--">소스트리에서도 환경 설정을 할 수 있습니다. <span class="A------">GUI</span> 환경이라 좀 더 편리합니다. 소스트리를 실행한 후 <span class="x3---------">도구 </span><span class="x3--------- char-style-override-27">&gt;</span><span class="x3---------"> 옵션</span> 메뉴를 선택하면 다음과 같이 환경 설정 화면이 나옵니다. 여기서 <span class="x3---------">이름</span>과 <span class="x3---------">이메일 주소</span> 항목은 필수입니다. 일반적으로 소스트리를 설치할 때 입력했던 사용자 이름과 이메일 주소가 자동으로 입력되어 있습니다. 필자는 이름은 <span class="A------">hojinlee</span>로, 이메일 주소는 <span class="A------">infohojin</span>@<span class="A------">gmail</span>.<span class="A------">com</span>으로 입력했기 때문에 해당 값이 자동으로 입력되어 있습니다.</p>
