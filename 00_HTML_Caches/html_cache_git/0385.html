<h2>8.7 리베이스</h2>
<p class="x00--">브랜치를 합치는 방법은 두 가지입니다. 앞에서 배운 병합<span class="x3------">(</span><span class="A------ x3------">merge</span><span class="x3------">)</span>과 이 절에서 학습할 리베이스<span class="x3------">(</span><span class="A------ x3------">rebase</span><span class="x3------">)</span>입니다. 이번에는 커밋 순서를 재배열하는 리베이스 병합을 알아보겠습니다. </p>
<p class="x00--">리베이스는 커밋의 트리 구조를 재배열합니다. 커밋을 재배열하는 변경 결과가 병합과 유사합니다. 사실 실무에서는 <span class="A------ x3-------1">merge</span> 명령어보다는 커밋을 재배열하는 리베이스를 더 선호하는 편입니다.</p>
