<h3>9.2.11 주의할 점</h3>
<p class="x00--">리셋 기능을 이용하면 독립된 개인 프로젝트를 관리할 때 쉽게 이전 상태로 복귀할 수 있습니다. 하지만 <span class="x3---------">저장소를 외부에 공개했거나 공유하고 있다면 주의해서 리셋을 사용</span>해야 합니다. 작성된 커밋이 리셋으로 삭제되면 함께 작업하는 개발자에게 혼란을 줄 수 있습니다. 일반적으로 협업하거나 소스 코드를 공유한 후에는 리셋 작업을 하지 않습니다.</p>
