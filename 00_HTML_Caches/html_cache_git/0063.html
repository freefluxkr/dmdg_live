<h2>2.5 비주얼 스튜디오 코드</h2>
<p class="x00--">깃에서 실습하다 보면 코드를 작성해야 할 때가 있습니다. 코드를 작성하려면 코드 편집기가 필요합니다. 책에서는 코드 편집용 툴로 비주얼 스튜디오 코드<span class="x3------">(</span><span class="A------ x3------">VS</span><span class="x3------"> </span><span class="A------ x3------">Code</span><span class="x3------">, </span><span class="A------ x3------">Visual</span><span class="x3------"> </span><span class="A------ x3------">Studio</span><span class="x3------"> </span><span class="A------ x3------">Code</span><span class="x3------">)</span>를 사용합니다. <span class="A------">VS</span> <span class="A------">Code</span>는 무료로 내려받아 설치할 수 있습니다. 또는 자신에게 익숙한 다른 편집기를 사용해도 됩니다.</p>
<p class="x00--"><span class="A------">VS</span> <span class="A------">Code</span>는 다음과 같이 터미널에서 명령어로 쉽게 실행할 수 있습니다.</p>
<div class="frame">
<p class="N------2 para-style-override-39">$ code <span class="N--------1 N--------1">파일이름</span></p>
