<h3>4.6.3 수정된 파일 되돌리기</h3>
<p class="x00--">앞에서 살펴보았듯이, 파일을 수정하면 <span class="A------">modified</span> 상태로 변경됩니다. 하지만 수정하는 과정에서 파일을 잘못 수정할 수도 있습니다. 파일을 수정 전 상태로 되돌리려면 어떻게 해야 할까요?</p>
<p class="x00--">깃을 이용하면 수정한 파일을 커밋 전 마지막 내용으로 쉽게 되돌릴 수 있습니다. 바로 이전 커밋으로 되돌리는 명령어는 다음과 같습니다.</p>
<div class="frame-62">
<p class="N------2 para-style-override-39">$ git checkout -- <span class="N--------1 N--------1">수정파일이름</span></p>
</div>
<p class="x00--">수정 파일을 되돌리면 이전 커밋 이후에 작업한 수정 내역은 모두 삭제합니다.</p>
</div>
