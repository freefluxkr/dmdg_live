<h3>5.1.3 새 멤버</h3>
<p class="x00--">깃의 분산형 관리 체계는 다수의 사람과 협업하는 데 매력적입니다. 기존 프로젝트에 새로운 멤버가 참여할 때, 지금까지 작업한 소스 코드의 마지막 버전을 <span class="x3---------">공유</span>해야 합니다.</p>
<p class="x00--">기존에는 코드를 공유하려고 이메일, 외부 저장 장치 등을 이용했지만, 이제는 <span class="x3---------">깃의 원격 저장소 주소만 알려 주면 모두 해결됩니다.</span> 원격 저장소로 모든 구성원에게 코드의 최종 결과물을 동기화합니다.</p>
