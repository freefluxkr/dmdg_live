<h2>8.3 3-way 병합</h2>
<p class="x00--">이번에는 깃의 또 다른 병합 알고리즘인 <span class="A------">3</span><span class="x-----">-</span><span class="A------">way</span> 방식을 알아보겠습니다. <span class="A------">3</span><span class="x-----">-</span><span class="A------">way</span> 병합은 좀 더 복잡한 병합을 처리할 수 있는 방법입니다. 여러 개발자와 협업으로 작업하는 경우 대부분 <span class="A------">3</span><span class="x-----">-</span><span class="A------">way</span> 병합을 사용합니다. </p>
