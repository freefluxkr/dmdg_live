<h2>2.6 정리</h2>
<p class="x00--">지금까지 깃의 기본적인 설치 방법과 환경 설정을 알아보았습니다. 모든 학습이 그렇듯이 처음에 프로그램을 설치하고 환경 설정을 하는 데 많은 시간이 소요됩니다. 책 내용을 천천히 따라가면서 자신만의 개발 환경을 설정하세요. 다음 장부터는 깃의 개념과 사용법을 하나씩 알아보겠습니다.</p>
