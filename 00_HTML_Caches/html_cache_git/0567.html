<h3>12.2.4 기록 유지</h3>
<p class="x00--"><span class="A------">refs</span>는 현재 로컬 저장소에서 작업한 모든 로그의 참조 기록입니다. 깃은 커밋, 브랜치 등 내부적으로 사용한 모든 객체의 로그를 기록합니다. 하지만 <span class="A------">refs</span>는 로컬 저장소에만 기록하므로 원격 저장소나 복제, 복사 등으로는 <span class="A------">refs</span> 기록을 옮길 수 없습니다. </p>
