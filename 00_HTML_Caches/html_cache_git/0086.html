<h2>3.3 스테이지</h2>
<p class="x00--">깃은 여러 단계의 논리적인 저장 공간을 가지고 있습니다. 스테이지<span class="x3------">(</span><span class="A------ x3------">stage</span><span class="x3------">)</span>는 ‘임시로 저장하는 공간’을 의미합니다. 스테이지 영역은 워킹 디렉터리에서 제출된 <span class="A------ x3---------">tracked</span><span class="x3---------"> 파일들을 관리</span>합니다. <span class="x3---------">이 영역은 나중에 배울 커밋 작업과 연관이 매우 많습니다.</span></p>
