<h3>2.4.6 별칭</h3>
<p class="x00--">좀 더 고급 환경 설정으로 별칭을 사용할 수 있습니다. 별칭은 복잡한 깃 명령어를 단순하게 닉네임 형태로 등록해 두는 기능입니다. 예를 들어 다음과 같이 <span class="A------ x3-------1">log</span><span class="x3-------1"> </span><span class="x----- x3-------1">--</span><span class="A------ x3-------1">graph</span><span class="x3-------1"> </span><span class="x----- x3-------1">--</span><span class="A------ x3-------1">pretty</span><span class="x3-------1">=</span><span class="A------ x3-------1">oneline</span> 명령어를 <span class="A------ x3-------1">show</span><span class="x----- x3-------1">-</span><span class="A------ x3-------1">graph</span>라는 별칭으로 등록해 두면 이후로는 이 별칭을 사용할 수 있습니다.</p>
<p class="lbl"><span class="ex">예</span></p>
<pre><code><p class="N---- para-style-override-16">$ <span class="x--">git config -global alias.show-graph 'log --graph --pretty=oneline'</span><span class="x--"></span></p></code></pre>
