<h3>4.6.4 스테이지에 등록</h3>
<p class="x00--">변경된 소스 코드를 커밋하는 것은 처음 파일을 생성하고 등록하는 과정과 매우 유사합니다. </p>
<p class="fcap">▼ 그림 4-20 스테이지에 등록</p>
<img alt="236433.png" class="w50" src="https://thebook.io/img/080212/236433.png"/>
<p class="x00--"><span>➊</span> 기존 파일을 수정하면 해당 파일은 <span class="A------">modified</span> 상태로 변경됩니다. 그리고 다시 워킹 디렉터리로 이동합니다. <span>➋</span> 파일이 수정되면 반드시 <span class="A------ x3-------1 char-style-override-24">add</span><span class="x3---------"> 명령어로 스테이지 영역에 재등록</span>해야 합니다. 즉, 파일을 수정할 때마다<span class="x3---------"> 등록 작업을 반복</span>해야 한다는 것을 잊지 마세요. 또는 소스트리에서 <span class="x3---------">모두 스테이지에 올리기</span>를 사용합니다.</p>
<div class="frame-62">
<p class="N------2 para-style-override-39">$ git add <span class="N--------1 N--------1">수정파일이름</span></p>
