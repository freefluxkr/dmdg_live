<h3>8.7.1 베이스</h3>
<p class="x00--">다시 브랜치 개념을 떠올려 봅시다. 모든 브랜치는 뿌리가 있습니다(<span class="A------">master</span> 브랜치는 예외입니다). 브랜치는 특정 커밋을 가리키는 포인터입니다. 그리고 가리키는 특정 커밋은 브랜치가 파생된 기준이 됩니다. 즉, 브랜치는 커밋 하나를 기준으로 새로운 작업을 진행할 수 있는 분리된 작업 경로를 의미합니다. </p>
<p class="fcap">▼ 그림 8-33 브랜치의 기준 커밋</p>
<img alt="316626.png" class="w60" src="https://thebook.io/img/080212/316626.png"/>
<p class="x00--">그림에서 새로운 브랜치가 커밋<span class="A------">2</span>에서 파생됩니다. 새로운 <span class="x3---------">브랜치가 파생되는 커밋</span><span class="A------ x3---------">2</span><span class="x3---------">를 </span><span class="x3---------">베이스</span><span class="x3------">(</span><span class="A------ x3------">base</span><span class="x3------">)</span><span class="x3---------">라고 합니다.</span> 병합에서는 이를 공통 조상 커밋이라고 합니다.</p>
