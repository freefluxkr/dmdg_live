<h3>4.8.1 SHA1</h3>
<p class="x00--">커밋 아이디가 이렇게 복잡한 영어와 숫자로 된 이유는 깃이 <span class="A------">SHA</span><span class="A------">1</span>이라는 해시<span class="x8-----"><a class="footnote-link" href="https://thebook.io/080212/0175/#footnote-230987-3" id="footnote-230987-3-backlink">3</a></span> 알고리즘을 사용하기 때문입니다. <span class="A------">SHA</span><span class="A------">1</span> 해시키 값은 <span class="A------">40</span>자리의 복잡한 <span class="A------">hexa</span> 값으로 되어 있습니다. 깃은 스테이지 영역의 변경된 내용을 기반으로 <span class="A------">SHA</span><span class="A------">1</span> 해시키를 생성합니다. 따라서 <span class="A------">SHA</span><span class="A------">1</span> 해시는 <span class="x3---------">중복되지 않은 고유의 키</span>를 생성할 수 있는 장점이 있습니다.</p>
<p class="x00--">깃이 <span class="A------">SHA</span><span class="A------">1</span> 해시를 이용하는 것은 콘텐츠 추적과 분산형 저장 관리를 운영하면서 충돌을 방지하기 위해서입니다.</p>
