<p class="x00--">소스트리는 아틀라시안<span class="x3------">(</span><span class="A------ x3------">Atlassian</span><span class="x3------">)</span>에서 배포하는 <span class="A------">GUI</span> 깃 도구입니다. 소스트리를 사용하려면 기본적으로 깃을 컴퓨터에 설치해야 합니다. 소스트리는 깃을 <span class="A------">GUI</span>로 사용하는 외부 도구일 뿐입니다.</p>
