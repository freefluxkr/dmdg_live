<h3>12.5.2 압축 관리</h3>
<p class="x00--">깃의 내부 원리는 <span class="A------">SHA</span><span class="A------">1</span> 해시와 객체의 응용입니다. 파일 변경, 트리 구조, 커밋 등 대부분의 내부 작업은 객체를 생성하고 연결하는 동작들입니다. 커밋들이 실행될 때 이러한 내부 동작으로 연결 고리가 없는 객체가 수없이 생성됩니다. 깃 내부에 이러한 객체가 많아지면 저장소 용량도 커지고, 객체도 빠르게 관리하기 어렵습니다. 깃은 이러한 객체를 줄이려고 생성된 객체를 압축합니다. 즉, 깃은 연결 고리가 없는 객체들을 <span class="A------">pack</span> 파일 형태로 압축하여 저장합니다. </p>
