<h3>2.3.1 터미널</h3>
<p class="x00--">터미널 환경이란 예전의 <span class="A------">MS</span><span class="x-----">-</span><span class="A------">DOS</span> 또는 셸<span class="x3------">(</span><span class="A------ x3------">shell</span><span class="x3------">)</span>처럼 텍스트 명령어를 입력하고 실행하는 환경을 의미합니다. 터미널을 이용하면 깃 작업을 좀 더 다양하게 할 수 있습니다. <span class="A------">GUI</span>는 많이 사용하는 기능 위주로 동작을 구현했기 때문에 터미널보다 정밀한 작업은 하기 어렵습니다.</p>
