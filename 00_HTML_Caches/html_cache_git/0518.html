<h2>11.2 실습을 위한 저장소 준비</h2>
<p class="x00--">서브모듈을 실습할 수 있는 환경을 구축하겠습니다. 서브모듈을 테스트하려면 저장소가 <span class="A------">2</span>개 필요합니다. 먼저 로컬 컴퓨터에 깃 저장소를 <span class="A------">2</span>개 생성할 것입니다. 그리고 원격 저장소도 <span class="A------">2</span>개 생성하여 각 로컬 저장소와 연결하겠습니다.</p>
