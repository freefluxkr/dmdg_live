<h3>12.5.4 refs 압축</h3>
<p class="x00--"><span class="A------ x3-------1">gc</span> 명령어는 객체의 압축과 <span class="A------">refs</span>를 같이 처리합니다. <span class="A------">refs</span>를 같이 압축하면 압축하기 전의 파일들은 삭제됩니다. 그리고 새로운 .<span class="A------">git</span>/<span class="A------">packed</span><span class="x-----">-</span><span class="A------">refs</span> 파일을 생성합니다.</p>
<p class="x00--">이후 <span class="A------">refs</span>가 추가로 변경되면 압축한 <span class="A------">packed</span><span class="x-----">-</span><span class="A------">refs</span> 값을 수정하지 않고 새로운 <span class="A------">refs</span> 파일을 생성합니다. 즉, 압축한 이후에는 <span class="A------">refs</span> 파일이 <span class="A------">2</span>개가 되며, <span class="A------">refs</span> 파일이 여러 개 있으면 기본적으로 <span class="A------">refs</span> 안에 있는 파일을 먼저 찾습니다. 그리고 이후에 압축된 <span class="A------">packed</span><span class="x-----">-</span><span class="A------">refs</span> 내용을 검색합니다.</p>
