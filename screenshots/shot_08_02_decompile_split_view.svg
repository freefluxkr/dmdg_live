<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sidebar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="960" height="540" fill="#0b0f19" />

  <!-- Window Container -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="920" height="500" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect x="20" y="20" width="920" height="42" rx="10" fill="url(#header-grad)" />
    <!-- Round bottom corners fix for header -->
    <rect x="20" y="52" width="920" height="10" fill="url(#header-grad)" />
    <line x1="20" y1="62" x2="940" y2="62" stroke="#334155" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="45" cy="41" r="6" fill="#ef4444" />
    <circle cx="65" cy="41" r="6" fill="#f59e0b" />
    <circle cx="85" cy="41" r="6" fill="#10b981" />

    <!-- Title and Shot ID -->
    <text x="120" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Antigravity IDE 2.0</text>
    <text x="250" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">— 디컴파일 어셈블리 vs TypeScript Split 비교</text>

    <!-- Shot ID Badge -->
    <rect x="800" y="31" width="120" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="860" y="46" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">SHOT-08-02</text>
  </g>

  <!-- Custom Inner Content -->
  <g transform="translate(20, 62)">
    
      <!-- Left: Assembly -->
      <rect x="30" y="20" width="430" height="380" rx="6" fill="#0f172a" stroke="#64748b" />
      <text x="50" y="50" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8">Raw Ghidra Decompile (x86-64)</text>
      <text x="50" y="85" font-family="monospace" font-size="11" fill="#cbd5e1">0x401020: push   rbp</text>
      <text x="50" y="110" font-family="monospace" font-size="11" fill="#cbd5e1">0x401021: mov    rbp, rsp</text>
      <text x="50" y="135" font-family="monospace" font-size="11" fill="#cbd5e1">0x401024: mov    DWORD PTR [rbp-4], edi</text>
      <text x="50" y="160" font-family="monospace" font-size="11" fill="#f59e0b">0x401027: imul   eax, DWORD PTR [rbp-4], 0x10</text>
      <text x="50" y="185" font-family="monospace" font-size="11" fill="#cbd5e1">0x40102b: cdq</text>
      <text x="50" y="210" font-family="monospace" font-size="11" fill="#f59e0b">0x40102c: idiv   100</text>

      <!-- Right: Restored TypeScript -->
      <rect x="480" y="20" width="450" height="380" rx="6" fill="#1e293b" stroke="#38bdf8" />
      <text x="500" y="50" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Clean-Room TypeScript Recovery</text>
      <text x="500" y="85" font-family="monospace" font-size="11" fill="#7ee787">export function calculatePercentage</text>
      <text x="520" y="110" font-family="monospace" font-size="11" fill="#cbd5e1">(base: number, rate: number = 10): number &#123;</text>
      <text x="520" y="135" font-family="monospace" font-size="11" fill="#38bdf8">  if (base &lt; 0) throw new Error("Invalid");</text>
      <text x="520" y="160" font-family="monospace" font-size="11" fill="#ff7b72">  return (base * rate) / 100;</text>
      <text x="500" y="185" font-family="monospace" font-size="11" fill="#cbd5e1">&#125;</text>
    
  </g>

  <!-- Subtitle Bar at Bottom -->
  <rect x="20" y="488" width="920" height="32" rx="0" fill="#0b0f19" />
  <line x1="20" y1="488" x2="940" y2="488" stroke="#1e293b" stroke-width="1" />
  <circle cx="42" cy="504" r="4" fill="#10b981" />
  <text x="55" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">Clean-Room Lab: <tspan fill="#38bdf8">C:\antigravity-lab\</tspan> | 바이트코드에서 모던 클린룸 코드로의 변환 검증</text>
  <text x="910" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#10b981" text-anchor="end">● Connected (DeepMind AI Engine)</text>
</svg>
