<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sidebar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="960" height="540" fill="#0b0f19" />

  <!-- Window Container -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="920" height="500" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect x="20" y="20" width="920" height="42" rx="10" fill="url(#header-grad)" />
    <!-- Round bottom corners fix for header -->
    <rect x="20" y="52" width="920" height="10" fill="url(#header-grad)" />
    <line x1="20" y1="62" x2="940" y2="62" stroke="#334155" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="45" cy="41" r="6" fill="#ef4444" />
    <circle cx="65" cy="41" r="6" fill="#f59e0b" />
    <circle cx="85" cy="41" r="6" fill="#10b981" />

    <!-- Title and Shot ID -->
    <text x="120" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Antigravity IDE 2.0</text>
    <text x="250" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">— /plan 인터뷰 아키텍처 다이어그램</text>

    <!-- Shot ID Badge -->
    <rect x="800" y="31" width="120" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="860" y="46" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">SHOT-05-02</text>
  </g>

  <!-- Custom Inner Content -->
  <g transform="translate(20, 62)">
    
      <rect x="40" y="20" width="840" height="380" rx="8" fill="#0f172a" stroke="#818cf8" />
      <text x="65" y="55" font-family="sans-serif" font-size="15" font-weight="700" fill="#818cf8">📋 /plan &amp; /grill-me Pre-Flight Architectural Interview</text>
      
      <rect x="65" y="80" width="790" height="70" rx="6" fill="#1e293b" />
      <text x="85" y="105" font-family="sans-serif" font-size="12" font-weight="700" fill="#f59e0b">Q1. 데이터베이스 영속성은 SQLite 로컬 파일인가요, 메모리 DB인가요?</text>
      <text x="85" y="130" font-family="sans-serif" font-size="12" fill="#cbd5e1">A. 로컬 `data/cookbook.db`에 영속화하고 WAL 모드를 적용합니다.</text>

      <rect x="65" y="165" width="790" height="70" rx="6" fill="#1e293b" />
      <text x="85" y="190" font-family="sans-serif" font-size="12" font-weight="700" fill="#f59e0b">Q2. 모바일 브라우저 뷰포트 반응형 브레이크포인트 기준은?</text>
      <text x="85" y="215" font-family="sans-serif" font-size="12" fill="#cbd5e1">A. 768px 이하 모바일 전용 수직 Flex 레이아웃 및 딥네이비 고대비 적용.</text>

      <rect x="65" y="250" width="790" height="120" rx="6" fill="#0b0f19" stroke="#10b981" />
      <text x="85" y="280" font-family="sans-serif" font-size="13" font-weight="700" fill="#10b981">✔ Confirmed Architectural Specification Locked</text>
      <text x="85" y="305" font-family="sans-serif" font-size="11" fill="#94a3b8">Artifact: `arch_plan_locked.md` — Code generation starting with 0 hallucination risk.</text>
    
  </g>

  <!-- Subtitle Bar at Bottom -->
  <rect x="20" y="488" width="920" height="32" rx="0" fill="#0b0f19" />
  <line x1="20" y1="488" x2="940" y2="488" stroke="#1e293b" stroke-width="1" />
  <circle cx="42" cy="504" r="4" fill="#10b981" />
  <text x="55" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">Clean-Room Lab: <tspan fill="#38bdf8">C:\antigravity-lab\</tspan> | 코드 작성 전 리스크를 제로화하는 설계 인터뷰 아티팩트</text>
  <text x="910" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#10b981" text-anchor="end">● Connected (DeepMind AI Engine)</text>
</svg>
