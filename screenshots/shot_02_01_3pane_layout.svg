<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sidebar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="960" height="540" fill="#0b0f19" />

  <!-- Window Container -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="920" height="500" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect x="20" y="20" width="920" height="42" rx="10" fill="url(#header-grad)" />
    <!-- Round bottom corners fix for header -->
    <rect x="20" y="52" width="920" height="10" fill="url(#header-grad)" />
    <line x1="20" y1="62" x2="940" y2="62" stroke="#334155" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="45" cy="41" r="6" fill="#ef4444" />
    <circle cx="65" cy="41" r="6" fill="#f59e0b" />
    <circle cx="85" cy="41" r="6" fill="#10b981" />

    <!-- Title and Shot ID -->
    <text x="120" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Antigravity IDE 2.0</text>
    <text x="250" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">— 3-Pane 인터페이스 실전 화면</text>

    <!-- Shot ID Badge -->
    <rect x="800" y="31" width="120" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="860" y="46" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">SHOT-02-01</text>
  </g>

  <!-- Custom Inner Content -->
  <g transform="translate(20, 62)">
    
      <!-- Pane 1: Agent Chat -->
      <rect x="0" y="0" width="280" height="426" fill="#0d1117" stroke="#30363d" />
      <text x="15" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#58a6ff">💬 AGENT CHAT (Pane 1)</text>
      <rect x="15" y="45" width="250" height="70" rx="6" fill="#161b22" />
      <text x="25" y="70" font-family="sans-serif" font-size="11" fill="#7ee787">User: @math-core.dll 모던화 해줘</text>
      <text x="25" y="90" font-family="sans-serif" font-size="10" fill="#8b949e">Antigravity: 분석 후 TypeScript 작성 착수</text>

      <!-- Pane 2: Code Editor -->
      <rect x="280" y="0" width="360" height="426" fill="#161b22" stroke="#30363d" />
      <rect x="280" y="0" width="140" height="30" fill="#0d1117" />
      <text x="295" y="20" font-family="monospace" font-size="11" fill="#c9d1d9">calculator.ts ✕</text>
      <text x="295" y="55" font-family="monospace" font-size="11" fill="#ff7b72">export class <tspan fill="#d2a8ff">CleanCalculator</tspan> &#123;</text>
      <text x="310" y="75" font-family="monospace" font-size="11" fill="#79c0ff">  public computeTax</text>
      <text x="310" y="95" font-family="monospace" font-size="11" fill="#c9d1d9">    (amount: number): number &#123;</text>
      <text x="325" y="115" font-family="monospace" font-size="11" fill="#ff7b72">    return <tspan fill="#a5d6ff">amount * 0.1</tspan>;</text>
      <text x="310" y="135" font-family="monospace" font-size="11" fill="#c9d1d9">  &#125;</text>
      <text x="295" y="155" font-family="monospace" font-size="11" fill="#ff7b72">&#125;</text>

      <!-- Pane 3: Artifacts Live Viewer -->
      <rect x="640" y="0" width="280" height="426" fill="#090d16" />
      <text x="655" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#7ee787">🎨 ARTIFACTS (Pane 3)</text>
      <rect x="655" y="45" width="250" height="150" rx="6" fill="#1e293b" />
      <text x="670" y="75" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Flowchart Diagram</text>
      <circle cx="780" cy="115" r="20" fill="#0284c7" />
      <text x="780" y="120" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle">Input</text>
      <path d="M 780 135 L 780 155" stroke="#38bdf8" stroke-width="2" />
      <circle cx="780" cy="170" r="15" fill="#10b981" />
      <text x="780" y="174" font-family="sans-serif" font-size="9" fill="#fff" text-anchor="middle">TDD</text>
    
  </g>

  <!-- Subtitle Bar at Bottom -->
  <rect x="20" y="488" width="920" height="32" rx="0" fill="#0b0f19" />
  <line x1="20" y1="488" x2="940" y2="488" stroke="#1e293b" stroke-width="1" />
  <circle cx="42" cy="504" r="4" fill="#10b981" />
  <text x="55" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">Clean-Room Lab: <tspan fill="#38bdf8">C:\antigravity-lab\</tspan> | 대화창 + 텍스트 에디터 + 아티팩트 다이어그램 3분할</text>
  <text x="910" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#10b981" text-anchor="end">● Connected (DeepMind AI Engine)</text>
</svg>
