    <!-- Titlebar -->
    <rect x="20" y="20" width="920" height="42" rx="10" fill="url(#header-grad)" />
    <!-- Round bottom corners fix for header -->
    <rect x="20" y="52" width="920" height="10" fill="url(#header-grad)" />
    <line x1="20" y1="62" x2="940" y2="62" stroke="#334155" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="45" cy="41" r="6" fill="#ef4444" />
    <circle cx="65" cy="41" r="6" fill="#f59e0b" />
    <circle cx="85" cy="41" r="6" fill="#10b981" />

    <!-- Title and Shot ID -->
    <text x="120" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Antigravity IDE 2.0</text>
    <text x="250" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">— Jest/Vitest 100% Green 통과 콘솔</text>

    <!-- Shot ID Badge -->
    <rect x="800" y="31" width="120" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="860" y="46" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">SHOT-09-02</text>
  </g>

  <!-- Custom Inner Content -->
  <g transform="translate(20, 62)">
    
      <rect x="40" y="20" width="840" height="380" rx="8" fill="#000000" stroke="#10b981" stroke-width="2" />
      <text x="65" y="55" font-family="monospace" font-size="14" font-weight="700" fill="#10b981">PS C:ntigravity-lab&gt; npm test</text>
      
      <text x="65" y="95" font-family="monospace" font-size="12" fill="#cbd5e1"> RUN  v1.4.2 C:/antigravity-lab</text>
      <text x="65" y="130" font-family="monospace" font-size="12" fill="#10b981"> ✔ tests/calculator.spec.ts (14 tests passed)</text>
      <text x="85" y="155" font-family="monospace" font-size="11" fill="#94a3b8">  ✔ calculatePercentage with 10% rate (2ms)</text>
      <text x="85" y="175" font-family="monospace" font-size="11" fill="#94a3b8">  ✔ calculatePercentage with zero boundary (1ms)</text>
      <text x="85" y="195" font-family="monospace" font-size="11" fill="#94a3b8">  ✔ throws RangeError on negative inputs (2ms)</text>
      <text x="85" y="215" font-family="monospace" font-size="11" fill="#94a3b8">  ✔ decimal precision roundtrip 100% byte-match (3ms)</text>

      <rect x="65" y="250" width="790" height="50" rx="4" fill="#064e3b" />
      <text x="85" y="280" font-family="monospace" font-size="13" font-weight="700" fill="#34d399">Test Suites: 1 passed, 1 total | Tests: 14 passed, 14 total | Time: 0.812s</text>
    
  </g>

