    <text x="860" y="46" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">SHOT-03-01</text>
  </g>

  <!-- Custom Inner Content -->
  <g transform="translate(20, 62)">
    
      <rect x="40" y="20" width="840" height="380" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="60" y="50" font-family="monospace" font-size="12" fill="#38bdf8">📄 C:ntigravity-lab\.agentsules\AGENTS.md</text>
      <line x1="40" y1="65" x2="880" y2="65" stroke="#1e293b" />
      <text x="60" y="95" font-family="monospace" font-size="12" fill="#e2e8f0"># 🏛️ PROJECT CONSTITUTION: Clean-Room &amp; TypeScript Strict</text>
      <text x="60" y="125" font-family="monospace" font-size="11" fill="#94a3b8">## 1. Absolute Directives</text>
      <text x="80" y="150" font-family="monospace" font-size="11" fill="#7ee787">- NEVER use `any` type. Strict type interfaces required.</text>
      <text x="80" y="175" font-family="monospace" font-size="11" fill="#7ee787">- NEVER import real company domain or external secrets.</text>
      <text x="80" y="200" font-family="monospace" font-size="11" fill="#7ee787">- Clean-room path must be standard: `C:ntigravity-lab\`.</text>
      <text x="60" y="235" font-family="monospace" font-size="11" fill="#94a3b8">## 2. Reverse Engineering &amp; TDD Standard</text>
      <text x="80" y="260" font-family="monospace" font-size="11" fill="#38bdf8">- Write unit tests FIRST before implementing decoded routines.</text>
      <text x="80" y="285" font-family="monospace" font-size="11" fill="#38bdf8">- Non-blocking async execution: Avoid polling loops.</text>
    
  </g>

