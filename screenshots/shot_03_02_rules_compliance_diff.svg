<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sidebar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="960" height="540" fill="#0b0f19" />

  <!-- Window Container -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="920" height="500" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect x="20" y="20" width="920" height="42" rx="10" fill="url(#header-grad)" />
    <!-- Round bottom corners fix for header -->
    <rect x="20" y="52" width="920" height="10" fill="url(#header-grad)" />
    <line x1="20" y1="62" x2="940" y2="62" stroke="#334155" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="45" cy="41" r="6" fill="#ef4444" />
    <circle cx="65" cy="41" r="6" fill="#f59e0b" />
    <circle cx="85" cy="41" r="6" fill="#10b981" />

    <!-- Title and Shot ID -->
    <text x="120" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Antigravity IDE 2.0</text>
    <text x="250" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">— 규칙 준수 클린 코드 검증 비교 뷰</text>

    <!-- Shot ID Badge -->
    <rect x="800" y="31" width="120" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="860" y="46" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">SHOT-03-02</text>
  </g>

  <!-- Custom Inner Content -->
  <g transform="translate(20, 62)">
    
      <!-- Left: Before (Without Rules) -->
      <rect x="30" y="20" width="420" height="380" rx="6" fill="#181014" stroke="#e11d48" />
      <text x="50" y="50" font-family="sans-serif" font-size="13" font-weight="700" fill="#f43f5e">❌ Without AGENTS.md (Unregulated)</text>
      <text x="50" y="85" font-family="monospace" font-size="11" fill="#fca5a5">// Type unsafe, any types used</text>
      <text x="50" y="110" font-family="monospace" font-size="11" fill="#fda4af">function parse(data: any): any &#123;</text>
      <text x="70" y="135" font-family="monospace" font-size="11" fill="#fda4af">  return eval(data); // Security Risk!</text>
      <text x="50" y="160" font-family="monospace" font-size="11" fill="#fda4af">&#125;</text>
      <text x="50" y="200" font-family="monospace" font-size="11" fill="#fca5a5">// Arbitrary Sleep Loop (Token Waster)</text>
      <text x="50" y="225" font-family="monospace" font-size="11" fill="#fda4af">while(!done) &#123; sleep(1000); &#125;</text>

      <!-- Right: After (With AGENTS.md) -->
      <rect x="470" y="20" width="460" height="380" rx="6" fill="#0d1f19" stroke="#10b981" />
      <text x="490" y="50" font-family="sans-serif" font-size="13" font-weight="700" fill="#10b981">✔ With AGENTS.md (Strict Clean-Room)</text>
      <text x="490" y="85" font-family="monospace" font-size="11" fill="#86efac">// Strong Types, Zod Safe Schema</text>
      <text x="490" y="110" font-family="monospace" font-size="11" fill="#bbf7d0">export function parse&lt;T&gt;(data: unknown): T &#123;</text>
      <text x="510" y="135" font-family="monospace" font-size="11" fill="#bbf7d0">  return safeSchema.parse(data) as T;</text>
      <text x="490" y="160" font-family="monospace" font-size="11" fill="#bbf7d0">&#125;</text>
      <text x="490" y="200" font-family="monospace" font-size="11" fill="#86efac">// Reactive Wakeup Event Driven (0 Token)</text>
      <text x="490" y="225" font-family="monospace" font-size="11" fill="#bbf7d0">await eventHub.waitForCompletion(taskId);</text>
    
  </g>

  <!-- Subtitle Bar at Bottom -->
  <rect x="20" y="488" width="920" height="32" rx="0" fill="#0b0f19" />
  <line x1="20" y1="488" x2="940" y2="488" stroke="#1e293b" stroke-width="1" />
  <circle cx="42" cy="504" r="4" fill="#10b981" />
  <text x="55" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">Clean-Room Lab: <tspan fill="#38bdf8">C:\antigravity-lab\</tspan> | Before(규칙 미적용 난잡 코드) vs After(AGENTS.md 준수 무결점 코드)</text>
  <text x="910" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#10b981" text-anchor="end">● Connected (DeepMind AI Engine)</text>
</svg>
