<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sidebar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="960" height="540" fill="#0b0f19" />

  <!-- Window Container -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="920" height="500" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect x="20" y="20" width="920" height="42" rx="10" fill="url(#header-grad)" />
    <!-- Round bottom corners fix for header -->
    <rect x="20" y="52" width="920" height="10" fill="url(#header-grad)" />
    <line x1="20" y1="62" x2="940" y2="62" stroke="#334155" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="45" cy="41" r="6" fill="#ef4444" />
    <circle cx="65" cy="41" r="6" fill="#f59e0b" />
    <circle cx="85" cy="41" r="6" fill="#10b981" />

    <!-- Title and Shot ID -->
    <text x="120" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Antigravity IDE 2.0</text>
    <text x="250" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">— 메인/서브에이전트 오케스트레이션 개념 뷰</text>

    <!-- Shot ID Badge -->
    <rect x="800" y="31" width="120" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="860" y="46" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">SHOT-01-02</text>
  </g>

  <!-- Custom Inner Content -->
  <g transform="translate(20, 62)">
    
      <rect x="50" y="30" width="220" height="360" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="160" y="65" font-family="sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">🧠 Main Agent</text>
      <text x="160" y="90" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Single Context Orchestrator</text>
      <line x1="70" y1="110" x2="250" y2="110" stroke="#334155" />
      <rect x="70" y="130" width="180" height="60" rx="4" fill="#0f172a" />
      <text x="80" y="155" font-family="sans-serif" font-size="11" fill="#cbd5e1">• 의도 분석 &amp; 계획 수립</text>
      <text x="80" y="175" font-family="sans-serif" font-size="11" fill="#cbd5e1">• 태스크 비동기 분기</text>
      <rect x="70" y="210" width="180" height="60" rx="4" fill="#0f172a" />
      <text x="80" y="235" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Reactive Wakeup 수신</text>
      <text x="80" y="255" font-family="sans-serif" font-size="11" fill="#cbd5e1">• 최종 종합 리포트 생성</text>

      <path d="M 270 160 L 350 110" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
      <path d="M 270 210 L 350 210" stroke="#f59e0b" stroke-width="2" />
      <path d="M 270 260 L 350 310" stroke="#10b981" stroke-width="2" />

      <g transform="translate(360, 40)">
        <rect x="0" y="30" width="260" height="80" rx="6" fill="#1e293b" stroke="#38bdf8" />
        <text x="20" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">🤖 Subagent A (Linter &amp; Tests)</text>
        <text x="20" y="85" font-family="monospace" font-size="11" fill="#94a3b8">Vitest 12/12 Passing (Non-blocking)</text>

        <rect x="0" y="130" width="260" height="80" rx="6" fill="#1e293b" stroke="#f59e0b" />
        <text x="20" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#f59e0b">🌐 Subagent B (Browser E2E)</text>
        <text x="20" y="185" font-family="monospace" font-size="11" fill="#94a3b8">DOM Click / Input / Form Submit</text>

        <rect x="0" y="230" width="260" height="80" rx="6" fill="#1e293b" stroke="#10b981" />
        <text x="20" y="260" font-family="sans-serif" font-size="13" font-weight="700" fill="#10b981">🔍 Subagent C (MCP Tools Hub)</text>
        <text x="20" y="285" font-family="monospace" font-size="11" fill="#94a3b8">REA Ghidra &amp; SQLite Queries</text>
      </g>

      <rect x="660" y="90" width="220" height="240" rx="8" fill="#0f172a" stroke="#64748b" />
      <text x="770" y="125" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">🎨 Live Artifacts</text>
      <rect x="680" y="145" width="180" height="40" rx="4" fill="#1e293b" />
      <text x="770" y="170" font-family="sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Mermaid Architecture Flow</text>
      <rect x="680" y="195" width="180" height="40" rx="4" fill="#1e293b" />
      <text x="770" y="220" font-family="sans-serif" font-size="11" fill="#10b981" text-anchor="middle">Code Diff Split Inspector</text>
      <rect x="680" y="245" width="180" height="40" rx="4" fill="#1e293b" />
      <text x="770" y="270" font-family="sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle">WebP Interaction Video</text>
    
  </g>

  <!-- Subtitle Bar at Bottom -->
  <rect x="20" y="488" width="920" height="32" rx="0" fill="#0b0f19" />
  <line x1="20" y1="488" x2="940" y2="488" stroke="#1e293b" stroke-width="1" />
  <circle cx="42" cy="504" r="4" fill="#10b981" />
  <text x="55" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">Clean-Room Lab: <tspan fill="#38bdf8">C:\antigravity-lab\</tspan> | 단일 컨텍스트 내 병렬 자율 실행 아키텍처</text>
  <text x="910" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#10b981" text-anchor="end">● Connected (DeepMind AI Engine)</text>
