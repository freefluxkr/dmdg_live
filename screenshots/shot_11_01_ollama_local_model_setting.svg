    <rect x="20" y="20" width="920" height="500" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect x="20" y="20" width="920" height="42" rx="10" fill="url(#header-grad)" />
    <!-- Round bottom corners fix for header -->
    <rect x="20" y="52" width="920" height="10" fill="url(#header-grad)" />
    <line x1="20" y1="62" x2="940" y2="62" stroke="#334155" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="45" cy="41" r="6" fill="#ef4444" />
    <circle cx="65" cy="41" r="6" fill="#f59e0b" />
    <circle cx="85" cy="41" r="6" fill="#10b981" />

    <!-- Title and Shot ID -->
    <text x="120" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Antigravity IDE 2.0</text>
    <text x="250" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">— Ollama 로컬 모델 엔드포인트 연결</text>

    <!-- Shot ID Badge -->
    <rect x="800" y="31" width="120" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="860" y="46" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">SHOT-11-01</text>
  </g>

  <!-- Custom Inner Content -->
  <g transform="translate(20, 62)">
    
      <rect x="40" y="20" width="840" height="380" rx="8" fill="#0f172a" stroke="#818cf8" />
      <text x="65" y="55" font-family="sans-serif" font-size="15" font-weight="700" fill="#818cf8">🛡️ On-Device Privacy &amp; Local Model Endpoint Config</text>
      
      <rect x="65" y="85" width="790" height="70" rx="6" fill="#1e293b" />
      <text x="85" y="115" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Local LLM Provider: Ollama (Offline Engine)</text>
      <text x="85" y="135" font-family="monospace" font-size="11" fill="#38bdf8">Endpoint: http://127.0.0.1:11434/v1 | Model: deepseek-coder-v2:16b</text>

      <rect x="65" y="175" width="790" height="70" rx="6" fill="#1e293b" />
      <text x="85" y="205" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Cloud Traffic Guard (Data Leakage Protection)</text>
      <text x="85" y="225" font-family="sans-serif" font-size="11" fill="#10b981">Status: STRICT LOCK (External API Network Blocked — 0 B Sent to Cloud)</text>

      <rect x="65" y="265" width="220" height="36" rx="4" fill="#10b981" />
      <text x="175" y="288" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✔ Verified Offline Shield</text>
    
