<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sidebar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="960" height="540" fill="#0b0f19" />

  <!-- Window Container -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="920" height="500" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect x="20" y="20" width="920" height="42" rx="10" fill="url(#header-grad)" />
    <!-- Round bottom corners fix for header -->
    <rect x="20" y="52" width="920" height="10" fill="url(#header-grad)" />
    <line x1="20" y1="62" x2="940" y2="62" stroke="#334155" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="45" cy="41" r="6" fill="#ef4444" />
    <circle cx="65" cy="41" r="6" fill="#f59e0b" />
    <circle cx="85" cy="41" r="6" fill="#10b981" />

    <!-- Title and Shot ID -->
    <text x="120" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Antigravity IDE 2.0</text>
    <text x="250" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">— mcp_config.json 설정 및 MCP 도구 목록</text>

    <!-- Shot ID Badge -->
    <rect x="800" y="31" width="120" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="860" y="46" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">SHOT-07-01</text>
  </g>

  <!-- Custom Inner Content -->
  <g transform="translate(20, 62)">
    
      <rect x="30" y="20" width="420" height="380" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="50" y="50" font-family="monospace" font-size="12" fill="#38bdf8">📄 mcp_config.json</text>
      <text x="50" y="80" font-family="monospace" font-size="11" fill="#e2e8f0">&#123;</text>
      <text x="65" y="105" font-family="monospace" font-size="11" fill="#e2e8f0">  "mcpServers": &#123;</text>
      <text x="80" y="130" font-family="monospace" font-size="11" fill="#38bdf8">    "sqlite": &#123;</text>
      <text x="95" y="155" font-family="monospace" font-size="11" fill="#cbd5e1">      "command": "uvx",</text>
      <text x="95" y="180" font-family="monospace" font-size="11" fill="#cbd5e1">      "args": ["mcp-server-sqlite"]</text>
      <text x="80" y="205" font-family="monospace" font-size="11" fill="#38bdf8">    &#125;,</text>
      <text x="80" y="230" font-family="monospace" font-size="11" fill="#10b981">    "rea-engine": &#123; ... &#125;</text>
      <text x="50" y="255" font-family="monospace" font-size="11" fill="#e2e8f0">&#125;</text>

      <rect x="470" y="20" width="460" height="380" rx="6" fill="#1e293b" stroke="#10b981" />
      <text x="490" y="50" font-family="sans-serif" font-size="13" font-weight="700" fill="#10b981">🔌 Connected MCP Tools Hub</text>
      <rect x="490" y="70" width="420" height="40" rx="4" fill="#0f172a" />
      <text x="510" y="95" font-family="monospace" font-size="11" fill="#38bdf8">🔧 sqlite: read_query(sql: string)</text>
      <rect x="490" y="120" width="420" height="40" rx="4" fill="#0f172a" />
      <text x="510" y="145" font-family="monospace" font-size="11" fill="#38bdf8">🔧 sqlite: write_query(sql: string)</text>
      <rect x="490" y="170" width="420" height="40" rx="4" fill="#0f172a" />
      <text x="510" y="195" font-family="monospace" font-size="11" fill="#10b981">🔧 rea: decompile_binary(path: string)</text>
      <rect x="490" y="220" width="420" height="40" rx="4" fill="#0f172a" />
      <text x="510" y="245" font-family="monospace" font-size="11" fill="#10b981">🔧 rea: extract_functions(offset: string)</text>
    
  </g>

  <!-- Subtitle Bar at Bottom -->
  <rect x="20" y="488" width="920" height="32" rx="0" fill="#0b0f19" />
  <line x1="20" y1="488" x2="940" y2="488" stroke="#1e293b" stroke-width="1" />
  <circle cx="42" cy="504" r="4" fill="#10b981" />
  <text x="55" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">Clean-Room Lab: <tspan fill="#38bdf8">C:\antigravity-lab\</tspan> | SQLite DB와 외부 역공학 도구를 에이전트의 손발로 연결</text>
  <text x="910" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#10b981" text-anchor="end">● Connected (DeepMind AI Engine)</text>
</svg>
