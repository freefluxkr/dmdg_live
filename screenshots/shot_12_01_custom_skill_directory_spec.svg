      <text x="85" y="125" font-family="monospace" font-size="11" fill="#38bdf8">name: deploy-guard</text>
      <text x="85" y="145" font-family="monospace" font-size="11" fill="#38bdf8">description: 사내 무중단 배포 전 린트·타입체크·보안 취약점 3단계 무결점 검증 스킬</text>
