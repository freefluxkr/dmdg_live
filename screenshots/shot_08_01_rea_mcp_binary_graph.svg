<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sidebar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="960" height="540" fill="#0b0f19" />

  <!-- Window Container -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="920" height="500" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect x="20" y="20" width="920" height="42" rx="10" fill="url(#header-grad)" />
    <!-- Round bottom corners fix for header -->
    <rect x="20" y="52" width="920" height="10" fill="url(#header-grad)" />
    <line x1="20" y1="62" x2="940" y2="62" stroke="#334155" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="45" cy="41" r="6" fill="#ef4444" />
    <circle cx="65" cy="41" r="6" fill="#f59e0b" />
    <circle cx="85" cy="41" r="6" fill="#10b981" />

    <!-- Title and Shot ID -->
    <text x="120" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Antigravity IDE 2.0</text>
    <text x="250" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">— REA MCP 바이너리 함수 그래프 렌더링</text>

    <!-- Shot ID Badge -->
    <rect x="800" y="31" width="120" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="860" y="46" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">SHOT-08-01</text>
  </g>

  <!-- Custom Inner Content -->
  <g transform="translate(20, 62)">
    
      <rect x="40" y="20" width="840" height="380" rx="8" fill="#0b1120" stroke="#f59e0b" />
      <text x="65" y="55" font-family="sans-serif" font-size="15" font-weight="700" fill="#f59e0b">🔬 REA Ghidra Control Flow Graph (CFG) — `tiny-calc.exe`</text>

      <!-- CFG Nodes -->
      <g transform="translate(320, 80)">
        <rect x="0" y="0" width="200" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" />
        <text x="100" y="25" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">main(argc, argv)</text>
        <text x="100" y="42" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">cmp eax, 0x5b</text>

        <path d="M 50 50 L -80 100" stroke="#10b981" stroke-width="2" />
        <path d="M 150 50 L 280 100" stroke="#ef4444" stroke-width="2" />

        <rect x="-160" y="100" width="180" height="60" rx="6" fill="#1e293b" stroke="#10b981" />
        <text x="-70" y="125" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle">BRANCH_TRUE (0x401020)</text>
        <text x="-70" y="145" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">mul edx, 0.10 (Tax Add)</text>

        <rect x="200" y="100" width="180" height="60" rx="6" fill="#1e293b" stroke="#ef4444" />
        <text x="290" y="125" font-family="monospace" font-size="11" fill="#ef4444" text-anchor="middle">BRANCH_FALSE (0x401050)</text>
        <text x="290" y="145" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">sub eax, 0x1 (Regular)</text>
      </g>
    
  </g>

  <!-- Subtitle Bar at Bottom -->
  <rect x="20" y="488" width="920" height="32" rx="0" fill="#0b0f19" />
  <line x1="20" y1="488" x2="940" y2="488" stroke="#1e293b" stroke-width="1" />
  <circle cx="42" cy="504" r="4" fill="#10b981" />
  <text x="55" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">Clean-Room Lab: <tspan fill="#38bdf8">C:\antigravity-lab\</tspan> | 소스 없는 실행 파일(EXE/DLL)의 제어 흐름 그래프 투시</text>
  <text x="910" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#10b981" text-anchor="end">● Connected (DeepMind AI Engine)</text>
</svg>
