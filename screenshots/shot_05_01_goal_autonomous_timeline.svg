<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sidebar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="960" height="540" fill="#0b0f19" />

  <!-- Window Container -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="920" height="500" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect x="20" y="20" width="920" height="42" rx="10" fill="url(#header-grad)" />
    <!-- Round bottom corners fix for header -->
    <rect x="20" y="52" width="920" height="10" fill="url(#header-grad)" />
    <line x1="20" y1="62" x2="940" y2="62" stroke="#334155" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="45" cy="41" r="6" fill="#ef4444" />
    <circle cx="65" cy="41" r="6" fill="#f59e0b" />
    <circle cx="85" cy="41" r="6" fill="#10b981" />

    <!-- Title and Shot ID -->
    <text x="120" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Antigravity IDE 2.0</text>
    <text x="250" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">— /goal 자율 태스크 타임라인</text>

    <!-- Shot ID Badge -->
    <rect x="800" y="31" width="120" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="860" y="46" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">SHOT-05-01</text>
  </g>

  <!-- Custom Inner Content -->
  <g transform="translate(20, 62)">
    
      <rect x="40" y="20" width="840" height="380" rx="8" fill="#0b1329" stroke="#38bdf8" />
      <text x="70" y="55" font-family="sans-serif" font-size="15" font-weight="700" fill="#38bdf8">🚀 Slash Command: /goal "풀스택 SaaS 태스크 허브 구축 및 E2E 통과"</text>
      
      <!-- Timeline items -->
      <line x1="90" y1="90" x2="90" y2="340" stroke="#334155" stroke-width="2" />
      
      <circle cx="90" cy="100" r="8" fill="#10b981" />
      <text x="115" y="105" font-family="sans-serif" font-size="12" fill="#e2e8f0"><tspan fill="#38bdf8" font-weight="700">01:00 AM</tspan> — Express API 서버 및 SQLite DB 스키마 생성 완료</text>

      <circle cx="90" cy="160" r="8" fill="#ef4444" />
      <text x="115" y="165" font-family="sans-serif" font-size="12" fill="#f87171"><tspan fill="#f59e0b" font-weight="700">01:45 AM</tspan> — React 프론트엔드 통신 에러 발생 (CORS 이슈 감지)</text>

      <circle cx="90" cy="220" r="8" fill="#f59e0b" />
      <text x="115" y="225" font-family="sans-serif" font-size="12" fill="#fde047"><tspan fill="#38bdf8" font-weight="700">02:10 AM</tspan> — 자율 디버깅: cors 미들웨어 설치 및 express 설정 자동 패치</text>

      <circle cx="90" cy="280" r="8" fill="#10b981" />
      <text x="115" y="285" font-family="sans-serif" font-size="12" fill="#86efac"><tspan fill="#10b981" font-weight="700">02:40 AM</tspan> — 브라우저 서브에이전트 E2E 테스트 100% PASS 확인</text>

      <circle cx="90" cy="330" r="8" fill="#38bdf8" />
      <text x="115" y="335" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">🎉 Goal Achieved: 14개 기능 완료 및 프로덕션 번들 빌드 성공</text>
    
  </g>

  <!-- Subtitle Bar at Bottom -->
  <rect x="20" y="488" width="920" height="32" rx="0" fill="#0b0f19" />
  <line x1="20" y1="488" x2="940" y2="488" stroke="#1e293b" stroke-width="1" />
  <circle cx="42" cy="504" r="4" fill="#10b981" />
  <text x="55" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">Clean-Room Lab: <tspan fill="#38bdf8">C:\antigravity-lab\</tspan> | 밤새 멈추지 않고 스스로 에러를 디버깅하는 철야 자율 모드</text>
  <text x="910" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#10b981" text-anchor="end">● Connected (DeepMind AI Engine)</text>
</svg>
