<h3 class="txt2 dm tcenter"><span class="dm brown bg_brown6">3</span><br/>
      마무리</h3>
</div>
<p class="txt dl">이 장에서 배운 내용을 정리해 보겠습니다.</p>
<p class="txtex dl s10_10"><span class="dm brown">1</span> <span class="dm">변수</span> 데이터를 저장하는 공간으로 저장된 데이터는 변경될 수 있다. 변수명은 저장된 데이터의 특징을 잘 살린 이름으로 짓는 것이 좋다.</p>
<p class="txts"> </p>
<p class="txtex dm s10_10"><span class="dm brown">2</span> <span class="dm">변수 만들기</span></p>
<div class="highlight">
<pre><span class="green"># 변수명 = 값</span>
a = <span class="green">10</span></pre>
</div>
<p class="txt dl ind10"><span class="cd">a</span>라는 이름의 변수를 만들고 10을 저장한다.</p>
<p class="txts"> </p>
<p class="txtex dl s10_10"><span class="dm brown">3</span> 변수에 값을 연산하는 식을 넣을 수도 있다.</p>
<div class="highlight">
<pre><span class="green"># 변수명 = 연산식</span>
result = p * r ** <span class="green">2</span></pre>
</div>
<p class="txt dl ind10"><span class="cd">result</span>에 <span class="cd">p * r ** 2</span>를 연산한 값을 저장한다.</p>
</div>
