<p class="txt bl">지금까지 배운 내용을 바탕으로 실제 파이썬 프로젝트를 진행해 보겠습니다. 프로젝트 로드맵에 따라 프로젝트 목표를 수립하고 프로그램을 구현한 후 실행결과를 분석합니다. Part 2 시작 부분에서 언급했듯이 핫플레이스의 인구 데이터를 분석합니다. 유명한 맛집이나 카페 등에는 언제 가야 가장 덜 붐빌지 인구 분석을 통해 사람이 적은 시간대를 구해 보겠습니다.</p>
