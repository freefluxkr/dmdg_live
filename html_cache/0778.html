    위젯 다루기</h3>

<p class="txt bl">지금까지 프로그램의 바탕이 되는 사용자 화면을 만들어 보았습니다. 이제 창에 배치할 위젯을 몇 가지 배워 봅시다. 위젯에는 텍스트, 이미지, 버튼, 콤보박스, 메시지박스 등 여러 종류가 있습니다. 이런 위젯을 화면에 표시하려면 다음 두 가지 작업을 해야 합니다.</p>
<p class="txt bl s10_10"><span class="dm brown">1</span> 사용하려는 위젯의 객체 만들기</p>
<p class="txt bl s10_10"><span class="dm brown">2</span> 만든 위젯을 창에 배치하기</p>
<p class="txt bl">이 두 가지를 모두 진행해야 위젯을 창에 표시할 수 있습니다.</p>
