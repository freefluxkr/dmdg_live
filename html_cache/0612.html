<p class="txt bl">연결 관계를 보면 인구 데이터와 위치 데이터를 이어주는 행정동코드 데이터가 매우 중요한 역할을 합니다. 행정동을 10개 골라야 하므로 1단계에서 얻어야 하는 행정동코드도 10개입니다. 이를 리스트로 묶으면 효율적입니다. 2단계에서도 행정동명이 10개 나오면 이를 묶어 하나의 리스트로 만듭니다. 마지막 단계에서도 마찬가지로 위도 10개, 경도 10개를 각각 묶어 리스트로 만들면 됩니다. 단계별로 만들어지는 리스트까지 정리하면 다음과 같습니다.</p>
