<h3 class="txt2 dm tcenter"><span class="dm brown bg_brown9">14.2</span><br/>
    클래스와 객체로 프로그램 작성하기</h3>
</div>
<p class="txt bl">클래스와 객체의 기본 구조와 사용법을 배웠습니다. 이번에는 클래스와 객체를 사용해 실생활 사례를 프로그램으로 작성해 보겠습니다.</p>
<p class="txt bl">온라인 쇼핑을 생각해 봅시다. 온라인 쇼핑몰에는 매우 다양한 상품이 등록되어 있습니다. 사람들은 온라인 쇼핑몰에 회원가입을 하고 물건을 구매합니다. 이를 클래스와 객체의 개념에 대입해 상품과 회원이라는 클래스를 만들어 보겠습니다. 그리고 새로운 상품을 등록할 때마다 상품 객체를 만들고, 새로운 회원이 가입할 때마다 회원 객체를 만듭니다.</p>
