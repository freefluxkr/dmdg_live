<p class="txt dm"><span class="txts bg_brown2">NOTE</span> 엑셀 파일을 CSV 파일로 변경하는 방법</p>
<p class="txt bl">분석하고 싶은 데이터가 엑셀 파일일 때 CSV 파일로 간단하게 변경할 수 있습니다. 엑셀 파일을 연 후 [파일 → 다른 이름으로 저장 → 파일 형식을 ‘CSV (쉼표로 분리)’ 선택] 순서로 저장하면 됩니다. 엑셀 버전에 따라 ‘CSV (쉼표로 분리)’ 외에 ‘CSV UTF-8<br/>
    (쉼표로 분리)’ 형식이 있을 수도 있습니다. 이럴 경우 ‘CSV (쉼표로 분리)’ 대신 ‘CSV UTF-8 (쉼표로 분리)’를 선택하세요.</p>
