<h3 class="txt2 dm tcenter"><span class="dm brown bg_brown9">13.1</span><br/>
    단축키 역할을 하는 사용자 정의 함수</h3>
</div>
<p class="txt bl">사용자 정의 함수는 우리가 익히 잘 아는 단축키 같은 개념입니다. 게임에서 공격하는 키와 앞으로 전진하는 키가 별도로 있을 때, 공격하고 전진하려면 각각의 키를 한 번씩, 총 두 번 눌러야 합니다. 단축키를 설정하면 편한 키 조합으로 전진하고 공격하기를 한 번에 할 수 있습니다.</p>
<div class="w70"><img alt="" class="w100" src="https://thebook.io/img/080251/536.jpg"/></div>
<p class="txts2 dl s12_12"><span class="dm gray">▲ 그림 13-1</span> 단축키 설정</p>
<p class="txt bl">프로그래밍에서도 단축키처럼 내장 함수를 조합해 다양한 기능을 한 번에 구현할 수 있습니다. 그럼 함께 사용자 정의 함수를 만들어 봅시다.</p>
