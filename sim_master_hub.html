<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 와 데이터 분석 22대 핵심 단원 - 마스터 인터랙티브 시뮬레이터 허브</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f97316;
      --primary-gradient: linear-gradient(135deg, #f97316, #ec4899);
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.9);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #090d16 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wrapper { max-width: 960px; width: 100%; }
    
    /* Top Navigation bar */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding: 12px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
    }
    .brand-badge {
      background: var(--primary-gradient);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      color: white;
    }
    .chapter-select {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      max-width: 320px;
      width: 100%;
    }
    .chapter-select:focus { border-color: var(--primary); }

    /* Chapter Header */
    .chapter-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .chapter-num {
      color: #fb923c;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .chapter-title {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }
    .chapter-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Simulation Canvas Card */
    .sim-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
    }

    /* Aha Box */
    .aha-box {
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.12), rgba(236, 72, 153, 0.12));
      border-left: 4px solid var(--primary);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .aha-icon { font-size: 32px; flex-shrink: 0; }
    .aha-title { font-weight: 800; color: #fb923c; font-size: 14.5px; margin-bottom: 4px; }
    .aha-text { font-size: 13.5px; color: #e2e8f0; line-height: 1.5; }

    /* Pipeline Stages View */
    .pipeline-container {
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 20px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Interactive Controls */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }
    .btn {
      padding: 10px 20px;
      font-size: 13.5px;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--primary-gradient);
      color: white;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(249, 115, 22, 0.6); }
    .btn-secondary { background: #334155; color: #f1f5f9; }
    .btn-secondary:hover { background: #475569; }
    .btn:active { transform: scale(0.96); }

    /* Visual Blocks for Pipeline */
    .stage-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      flex-wrap: wrap;
    }
    .stage-box {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      min-width: 180px;
      transition: all 0.3s ease;
    }
    .stage-box.active {
      border-color: #f97316;
      box-shadow: 0 0 16px rgba(249, 115, 22, 0.4);
      transform: translateY(-2px);
    }
    .stage-tag { font-size: 11px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
    .stage-name { font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .stage-content { font-size: 13px; color: #cbd5e1; }
    .stage-arrow { font-size: 22px; color: #f97316; font-weight: 900; }

    /* Quick Chapter Navigator Pills */
    .pills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
      justify-content: center;
    }
    .pill {
      background: #1e293b;
      color: #94a3b8;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .pill:hover, .pill.active {
      background: #f97316;
      color: white;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- Top Nav -->
    <div class="nav-bar">
      <div class="brand">
        <span class="brand-badge">22대 핵심 단원</span>
        <span>AI 파이프라인 시뮬레이터 허브</span>
      </div>
      <select id="chapter-select" class="chapter-select"></select>
    </div>

    <!-- Chapter Header -->
    <div class="chapter-header">
      <div class="chapter-num" id="chapter-num">Chapter 01</div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px;">
        <h1 class="chapter-title" id="chapter-title" style="margin-bottom: 0;">01. CNN (합성곱 신경망)</h1>
        <a id="btn-wiki-link" href="https://dmdg.wikidocs.net/451772" target="_blank" class="btn btn-secondary" style="font-size: 13px; padding: 6px 14px; border-radius: 8px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;">
          <span>📖 교재 해당 목차 바로가기</span> ↗
        </a>
      </div>
      <p class="chapter-subtitle" id="chapter-subtitle">로딩 중...</p>
    </div>

    <!-- Main Simulator Box -->
    <div class="sim-card">
      <div class="aha-box">
        <div class="aha-icon">💡</div>
        <div>
          <div class="aha-title">비전공자 '아하!' 핵심 전달 원리</div>
          <div class="aha-text" id="aha-text">로딩 중...</div>
        </div>
      </div>

      <div class="pipeline-container" id="pipeline-view">
        <!-- Dynamic pipeline render -->
      </div>

      <div class="controls-bar">
        <button class="btn btn-primary" id="btn-next">▶ 다음 단계로 데이터 전달 (Next Step)</button>
        <button class="btn btn-secondary" id="btn-auto">⚡ 자동 시뮬레이션 (Auto)</button>
        <button class="btn btn-secondary" id="btn-reset">🔄 처음부터 다시</button>
      </div>
    </div>

    <!-- Pills Grid -->
    <div class="pills-container" id="pills-container"></div>
  </div>

  <script>
    // 22개 단원 메타데이터 및 시뮬레이션 파이프라인 정의
    const CHAPTERS = [
      {
        id: 1,
        code: "01",
        title: "01. CNN (합성곱 신경망)",
        subtitle: "이미지 픽셀 위로 3×3 돋보기 커널이 슬라이딩하며 모서리 특징 맵을 추출하는 비전 파이프라인",
        aha: "CNN은 돋보기(필터)로 사진을 구석구석 훑으면서 '여기에 옷깃이나 모서리가 있나?'를 콕 집어 점수로 환산해 다음 층으로 넘겨주는 과정입니다.",
        stages: [
          { tag: "1단계: 입력", name: "의류 픽셀 (5×5)", desc: "옷 사진의 픽셀 명암 숫자들이 그리드로 배열됨" },
          { tag: "2단계: 내부 함수", name: "커널 곱셈 & 합산", desc: "3×3 필터와 겹치는 부분을 원소별 곱셈 후 더함 (내적)" },
          { tag: "3단계: 전달", name: "특징 맵 (3×3)", desc: "강한 윤곽선이 발견된 위치에 높은 점수가 찍혀 다음 층으로 전달" }
        ]
      },
      {
        id: 2,
        code: "02",
        title: "02. MaxPooling2D (최대 풀링)",
        subtitle: "2×2 영역에서 가장 강렬한 특징(최대값)만 보존하고 해상도를 75% 다이어트하는 파이프라인",
        aha: "4개의 숫자 중 가장 강한 놈(최대값) 하나만 살리고 나머지는 버립니다. 사진 크기는 1/4로 줄어들어 연산이 가벼워지면서도 윤곽선은 살아있습니다!",
        stages: [
          { tag: "1단계: 입력", name: "특징 맵 (4×4)", desc: "16개의 세부 특징 수치들이 밀집된 그리드" },
          { tag: "2단계: 내부 함수", name: "max() 윈도우", desc: "2×2 격자 안에서 가장 큰 숫자 1개만 추출" },
          { tag: "3단계: 전달", name: "압축 맵 (2×2)", desc: "해상도가 절반으로 축소된 채 Dense 레이어 또는 다음 Conv로 전달" }
        ]
      },
      {
        id: 3,
        code: "03",
        title: "03. Flatten과 Dense (평탄화와 전결합층)",
        subtitle: "2D/3D 바둑판 형태의 특징 맵을 1D 기차로 펴서 분류 뉴런들과 가중치로 연결하는 파이프라인",
        aha: "바둑판(2D)으로 모은 단서들을 1줄 기차(1D)로 촤르륵 편 뒤, '티셔츠일 확률', '바지일 확률'을 판별하는 전결합 노드에 가중치 선을 쫙 연결합니다.",
        stages: [
          { tag: "1단계: 입력", name: "2D 풀링 맵 (2×2)", desc: "가로×세로 격자 형태의 시각적 특징들" },
          { tag: "2단계: 내부 함수", name: "Flatten() 평탄화", desc: "격자를 1차원 벡터 [w1, w2, w3, w4]로 납작하게 폄" },
          { tag: "3단계: 전달", name: "Dense(W·X + b)", desc: "가중치와 곱하고 바이어스를 더해 최종 10개 의류 노드로 전달" }
        ]
      },
      {
        id: 4,
        code: "04",
        title: "04. Softmax와 ReLU (활성화 함수)",
        subtitle: "음수를 싹둑 잘라내는 ReLU와, 점수들을 다 합쳐 100% 확률로 정규화하는 Softmax 파이프라인",
        aha: "중간 층에서는 음수 잡음을 0으로 잘라내는 ReLU를 쓰고, 마지막 최종 출력층에서는 모든 점수를 합이 100%(1.0)가 되는 깔끔한 확률로 변환합니다.",
        stages: [
          { tag: "1단계: 입력", name: "원시 점수(Logits)", desc: "[-2.5, 4.2, 0.8] 음수와 양수가 뒤섞인 점수들" },
          { tag: "2단계: 내부 함수", name: "ReLU / exp() 지수화", desc: "ReLU(음수=0) 처리 후 Softmax 지수 함수로 모두 양수화" },
          { tag: "3단계: 전달", name: "확률 벡터 (합=100%)", desc: "[1%, 95%, 4%] ➔ '95% 확률로 티셔츠입니다!' 최종 판별" }
        ]
      },
      {
        id: 5,
        code: "05",
        title: "05. RNN (순환 신경망)",
        subtitle: "이전 시점의 기억(은닉 상태)이 쳇바퀴처럼 돌아 현재 데이터와 만나 익일 수요를 예측하는 파이프라인",
        aha: "어제의 매장 방문객 기억($h_{t-1}$)을 머릿속에 품은 채로 오늘 날씨($x_t$)를 받아들여, 내일 방문객 수를 연쇄적으로 추론합니다.",
        stages: [
          { tag: "1단계: 입력", name: "현재 입력 (x_t)", desc: "오늘의 일별 매장 방문객 수 및 요일 데이터" },
          { tag: "2단계: 내부 함수", name: "순환 루프 (tanh)", desc: "이전 은닉상태(h_{t-1})와 현재 입력을 결합하여 상태 업데이트" },
          { tag: "3단계: 전달", name: "차기 기억 (h_t)", desc: "업데이트된 기억을 다음 날(t+1) 시점으로 넘겨 익일 수요 예측" }
        ]
      },
      {
        id: 6,
        code: "06",
        title: "06. LSTM (장단기 메모리)",
        subtitle: "망각 게이트(지우기)와 입력 게이트(담기)로 수주일 전의 중요한 기억을 유실 없이 보존하는 파이프라인",
        aha: "단순 RNN이 과거를 금방 까먹는다면, LSTM은 '필요 없는 과거는 지우개로 지우고(Forget), 중요한 사실만 공책에 적어(Cell State)' 먼 미래까지 전송합니다.",
        stages: [
          { tag: "1단계: 망각 게이트", name: "f_t = σ(W_f · [h, x])", desc: "오래된 기억 중 버릴 것은 0, 유지할 것은 1로 필터링" },
          { tag: "2단계: 입력 게이트", name: "i_t = σ(W_i · [h, x])", desc: "현재 들어온 새로운 정보 중 장기 기억에 담을 중요도 판별" },
          { tag: "3단계: 전달", name: "Cell State (C_t)", desc: "고속도로 레일을 타고 24시간 뒤 계절성 전력 예측 레이어로 전달" }
        ]
      },
      {
        id: 7,
        code: "07",
        title: "07. 의사 결정 트리 (Decision Tree)",
        subtitle: "스무고개처럼 꽃잎 길이를 기준으로 예/아니오 분기하며 불순도를 떨어뜨리는 화이트박스 머신러닝",
        aha: "'꽃잎 길이가 2.45cm 이하인가요?'라는 명확한 If-Else 질문을 던져 붓꽃 종류를 분필처럼 딱딱 갈라내는 가장 직관적인 모델입니다.",
        stages: [
          { tag: "1단계: 루트 노드", name: "전체 150송이 붓꽃", desc: "세 종류의 붓꽃이 뒤섞여 불순도(Gini=0.66)가 높은 상태" },
          { tag: "2단계: 질문 분기", name: "If 꽃잎길이 <= 2.45", desc: "불순도를 가장 많이 낮춰주는 최적 기준선으로 데이터 분할" },
          { tag: "3단계: 전달", name: "순수한 잎 노드(Leaf)", desc: "Setosa 품종 100% 순수 분리 완료 ➔ 설명가능한 AI(XAI)" }
        ]
      },
      {
        id: 8,
        code: "08",
        title: "08. Random Forest (랜덤 포레스트)",
        subtitle: "수백 그루의 나무가 각자 데이터를 무작위로 뽑아 학습한 뒤 다수결 투표(Voting)로 판정하는 앙상블",
        aha: "한 명의 의사보다 100명의 전문의가 각자 차트를 보고 다수결 투표로 유방암 양성/음성을 판정하듯, 훨씬 안전하고 정확한 진단을 내립니다.",
        stages: [
          { tag: "1단계: 부트스트랩", name: "데이터 무작위 샘플링", desc: "복원추출로 조금씩 다른 100개의 환자 하위 데이터셋 생성" },
          { tag: "2단계: 개별 트리", name: "100개 나무의 독립 진단", desc: "각 나무가 5대 핵심 생체 지표를 기반으로 독립적 결과 도출" },
          { tag: "3단계: 전달", name: "다수결 투표 (Voting)", desc: "85표 양성 vs 15표 음성 ➔ 안정적인 최종 판정 결과 배출" }
        ]
      },
      {
        id: 9,
        code: "09",
        title: "09. XGBoost (그래디언트 부스팅)",
        subtitle: "이전 나무가 틀린 오차(잔차, Residual)만을 집중적으로 다음 나무가 학습해 정답을 맞추는 부스팅",
        aha: "시험 보고 틀린 문제(오차)만 모아 오답 노트를 만들고, 다음 나무가 그 오답 노트만 맹훈련하여 와인 품질 등급을 극도로 정밀하게 맞춥니다.",

    const ahaTextEl = document.getElementById('aha-text');
    const pipelineViewEl = document.getElementById('pipeline-view');

    // Populate Selector and Pills
    CHAPTERS.forEach((ch, idx) => {
      // Select option
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `${ch.code}. ${ch.title.split(' ')[1] || ch.title}`;
      selectEl.appendChild(opt);

      // Pill button
      const pill = document.createElement('a');
      pill.className = `pill ${idx === 0 ? 'active' : ''}`;
      pill.textContent = ch.code;
      pill.title = ch.title;
      pill.href = `#${ch.code}`;
      pill.addEventListener('click', (e) => {
        e.preventDefault();
        loadChapter(idx);
      });
      pillsEl.appendChild(pill);
    });

    selectEl.addEventListener('change', (e) => {
      loadChapter(parseInt(e.target.value));
    });

    function loadChapter(idx) {
      currentChapterIndex = idx;
      currentStageIndex = 0;
      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
        document.getElementById('btn-auto').textContent = '⚡ 자동 시뮬레이션 (Auto)';
      }

      selectEl.value = idx;
      window.location.hash = CHAPTERS[idx].code;

      // Update pills
      document.querySelectorAll('.pill').forEach((p, i) => {
        if (i === idx) p.classList.add('active');
        else p.classList.remove('active');
      });

      const ch = CHAPTERS[idx];
      numEl.textContent = `Chapter ${ch.code}`;
      titleEl.textContent = ch.title;
      subtitleEl.textContent = ch.subtitle;
      ahaTextEl.textContent = ch.aha;
      
      const wikiLinkEl = document.getElementById('btn-wiki-link');
      if (wikiLinkEl) {
        wikiLinkEl.href = `https://dmdg.wikidocs.net/${451771 + ch.id}`;
      }

      renderPipeline(ch);
    }

    function renderPipeline(ch) {
      pipelineViewEl.innerHTML = '';
      const row = document.createElement('div');
      row.className = 'stage-row';

      ch.stages.forEach((st, sIdx) => {
        const box = document.createElement('div');
        box.className = `stage-box ${sIdx === currentStageIndex ? 'active' : ''}`;
        box.id = `stage-box-${sIdx}`;
        box.innerHTML = `
          <div class="stage-tag">${st.tag}</div>
          <div class="stage-name">${st.name}</div>
          <div class="stage-content">${st.desc}</div>
        `;
        row.appendChild(box);

        if (sIdx < ch.stages.length - 1) {
          const arrow = document.createElement('div');
          arrow.className = 'stage-arrow';
          arrow.textContent = '➔';
          row.appendChild(arrow);
        }
      });

      pipelineViewEl.appendChild(row);
    }

    function nextStage() {
      const ch = CHAPTERS[currentChapterIndex];
      currentStageIndex = (currentStageIndex + 1) % ch.stages.length;

      document.querySelectorAll('.stage-box').forEach((box, i) => {
        if (i === currentStageIndex) box.classList.add('active');
        else box.classList.remove('active');
      });
    }

    document.getElementById('btn-next').addEventListener('click', nextStage);

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
        document.getElementById('btn-auto').textContent = '⚡ 자동 시뮬레이션 (Auto)';
      }
      currentStageIndex = 0;
      document.querySelectorAll('.stage-box').forEach((box, i) => {
        if (i === 0) box.classList.add('active');
        else box.classList.remove('active');
      });
    });

    document.getElementById('btn-auto').addEventListener('click', function() {
      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
        this.textContent = '⚡ 자동 시뮬레이션 (Auto)';
      } else {
        this.textContent = '⏸ 일시 정지 (Pause)';
        autoInterval = setInterval(nextStage, 1400);
      }
    });

    // Check URL hash on load (e.g. #01, #07, #19)
    function checkHash() {
      const hash = window.location.hash.replace('#', '');
      if (hash) {
        const found = CHAPTERS.findIndex(c => c.code === hash || c.id.toString() === hash);
        if (found !== -1) {
          loadChapter(found);
          return;
        }
      }
      loadChapter(0);
    }

    window.addEventListener('hashchange', checkHash);
    checkHash();
  </script>
</body>
</html>
