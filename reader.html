<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>DMDG Books 독점 열람실 | books.dmdg-live.com</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

  <style>
    :root {
      --bg-dark: #0b1936;
      --bg-panel: rgba(15, 26, 52, 0.78);
      --bg-card: rgba(19, 34, 68, 0.85);
      --border-glass: rgba(255, 255, 255, 0.14);
      --border-gold: rgba(251, 191, 36, 0.55);
      --gold: #f59e0b;
      --gold-light: #fbbf24;
      --cyan: #38bdf8;
      --emerald: #34d399;
      --rose: #fb7185;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0b1936;
      background-image:
        radial-gradient(ellipse 80% 55% at 15% 10%, rgba(52, 211, 153, 0.24), transparent 62%),
        radial-gradient(ellipse 75% 55% at 85% 15%, rgba(56, 189, 248, 0.24), transparent 60%),
        radial-gradient(ellipse 70% 55% at 65% 75%, rgba(167, 139, 250, 0.22), transparent 62%),
        linear-gradient(155deg, #0b1936 0%, #122b52 46%, #1d2259 78%, #0f2447 100%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @media print {
      body { display: none !important; }
    }

    /* ── Policy Top Bar ───────────────────────────────────── */
    .policy-bar {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.22), rgba(56, 189, 248, 0.18), rgba(245, 158, 11, 0.22));
      border-bottom: 1px solid rgba(251, 191, 36, 0.35);
      padding: 0.5rem 1.25rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-size: 0.82rem;
    }
    .policy-pill {
      background: linear-gradient(135deg, #34d399, #059669);
      color: #06221b;
      font-weight: 800;
      padding: 0.18rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.74rem;
    }
    .policy-pill.paid {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0b1936;
    }

    /* ── Header ───────────────────────────────────────────── */
    .reader-header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(20px) saturate(145%);
      -webkit-backdrop-filter: blur(20px) saturate(145%);
      background: rgba(11, 22, 46, 0.84);
      border-bottom: 1px solid var(--border-glass);
      padding: 0.75rem 1.25rem;
    }
    .header-inner {
      max-width: 1560px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
      flex: 1;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.42rem 0.85rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f1f5f9;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s;
      font-family: inherit;
    }
    .nav-btn:hover {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--gold);
    }
    .book-header-meta {
      min-width: 0;
    }
    .book-header-title {
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 620px;
    }
    .book-header-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }
    .mode-switch {
      display: inline-flex;
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid var(--border-glass);
      border-radius: 9999px;
      padding: 0.2rem;
      gap: 0.2rem;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-sub);
      padding: 0.34rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.18s;
    }
    .mode-btn.active-pdf {
      background: rgba(52, 211, 153, 0.24);
      color: #6ee7b7;
    }
    .mode-btn.active-web {
      background: rgba(245, 158, 11, 0.28);
      color: #fde68a;
    }
    .auth-btn {
      border: 1px solid rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.16);
      color: #bae6fd;
      padding: 0.38rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .auth-btn.logged-in {
      border-color: rgba(52, 211, 153, 0.5);
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
    }

    /* ── Main 2-Column Workspace ──────────────────────────── */
    .workspace {
      max-width: 1560px;
      width: 100%;
      margin: 1rem auto;
      padding: 0 1.25rem 2rem;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1rem;
      flex: 1;
    }
    @media (max-width: 1024px) {
      .workspace { grid-template-columns: 1fr; }
    }

    .glass-panel {
      background: var(--bg-panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Left Sidebar TOC ─────────────────────────────────── */
    .toc-sidebar {
      max-height: calc(100vh - 140px);
      position: sticky;
      top: 84px;
    }
    @media (max-width: 1024px) {
      .toc-sidebar {
        position: static;
        max-height: 300px;
      }
    }
    .toc-head {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      font-weight: 800;
      color: #fde68a;
    }
    .toc-list {
      overflow-y: auto;
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.32rem;
    }
    .toc-item {
      padding: 0.5rem 0.65rem;
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .toc-item:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
      color: #ffffff;
    }
    .toc-item.is-part {
      margin-top: 0.35rem;
      font-weight: 800;
      color: #7dd3fc;
      background: rgba(56, 189, 248, 0.08);
    }
    .toc-item.active {
      background: rgba(245, 158, 11, 0.18);
      border-color: rgba(251, 191, 36, 0.5);
      color: #fde68a;
      font-weight: 700;
    }

    /* ── Viewer Main Pane ─────────────────────────────────── */
    .viewer-pane {
      min-height: 75vh;
      position: relative;
    }
    .viewer-toolbar {
      padding: 0.75rem 1.1rem;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.65rem;
      background: rgba(2, 6, 23, 0.35);
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f8fafc;
      padding: 0.38rem 0.78rem;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.16s;
    }
    .ctrl-btn:hover:not(:disabled) {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--cyan);
    }
    .ctrl-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }
    .page-jump-input {
      width: 60px;
      background: rgba(2, 6, 23, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      padding: 0.3rem 0.45rem;
      border-radius: 8px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
    }

    /* ── PDF Canvas Stage (Phase 1) ───────────────────────── */
    .pdf-stage {
      position: relative;
      flex: 1;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: auto;
      background: rgba(2, 6, 23, 0.45);
      user-select: none;
      -webkit-user-select: none;
    }
    .pdf-canvas-wrap {
      position: relative;
      display: inline-block;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
    }
    #pdfCanvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
    .watermark-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      opacity: 0.14;
      z-index: 5;
    }
    .watermark-text {
      transform: rotate(-24deg);
      font-size: 1.05rem;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      letter-spacing: 0.06em;
    }
    .web-watermark-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      user-select: none;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 1rem 1.4rem;
      opacity: 0.35;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      color: #94a3b8;
    }

    /* ── Web Reader Markdown Stage (Phase 2) ──────────────── */
    .web-stage {
      position: relative;
      padding: 1.8rem 2.2rem 2.5rem;
      flex: 1;
      overflow-y: auto;
    }
    @media (max-width: 768px) {
      .web-stage { padding: 1.15rem 1rem 2rem; }
    }
    .chapter-header-box {
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      padding-bottom: 1rem;
      margin-bottom: 1.4rem;
    }
    .chapter-badge {
      display: inline-block;
      padding: 0.24rem 0.72rem;
      border-radius: 9999px;
      font-size: 0.74rem;
      font-weight: 800;
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.42);
      color: #bae6fd;
      margin-bottom: 0.5rem;
    }
    .chapter-title {
      font-size: 1.5rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.35;
    }

    .md-body {
      color: #e2e8f0;
      font-size: 0.98rem;
      line-height: 1.78;
      max-width: 920px;
    }
    .md-body h1, .md-body h2, .md-body h3, .md-body h4 {
      color: #ffffff;
      margin: 1.5rem 0 0.75rem;
      font-weight: 800;
      line-height: 1.35;
    }
    .md-body h2 {
      font-size: 1.28rem;
      color: #fde68a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 0.38rem;
    }
    .md-body h3 { font-size: 1.1rem; color: #7dd3fc; }
    .md-body p { margin: 0.72rem 0; }
    .md-body ul, .md-body ol { padding-left: 1.4rem; margin: 0.7rem 0; }
    .md-body li { margin-bottom: 0.35rem; }
    .md-body blockquote {
      margin: 1rem 0;
      padding: 0.85rem 1.1rem;
      background: rgba(56, 189, 248, 0.1);
      border-left: 4px solid var(--cyan);
      border-radius: 8px;
      color: #e0f2fe;
    }
    .md-body pre {
      position: relative;
      background: #070b14;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 1rem;
      overflow-x: auto;
      margin: 1rem 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      line-height: 1.55;
    }
    .md-body code {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(15, 23, 42, 0.8);
      color: #fde68a;
      padding: 0.12rem 0.38rem;
      border-radius: 5px;
      font-size: 0.86em;
    }
    .md-body pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }
    .copy-code-btn {
      position: absolute;
      top: 0.55rem;
      right: 0.55rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #e2e8f0;
      border-radius: 7px;
      padding: 0.22rem 0.55rem;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .copy-code-btn:hover { background: rgba(56, 189, 248, 0.28); }
    .md-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.88rem;
      display: block;
      overflow-x: auto;
    }
    .md-body th, .md-body td {
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 0.55rem 0.75rem;
      text-align: left;
    }
    .md-body th {
      background: rgba(56, 189, 248, 0.14);
      color: #bae6fd;
    }
    .md-body img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin: 1rem auto;
      display: block;
    }
    .md-body a { color: #38bdf8; }

    /* ── Locked Gate Card (Phase 2) ───────────────────────── */
    .lock-gate-card {
      max-width: 680px;
      margin: 2rem auto;
      padding: 2rem;
      border-radius: 20px;
      background: linear-gradient(155deg, rgba(15, 26, 52, 0.92), rgba(29, 34, 89, 0.88));
      border: 1.5px solid rgba(251, 191, 36, 0.45);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
    }
    .lock-gate-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: #fde68a;
      margin-bottom: 0.6rem;
    }
    .lock-gate-desc {
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.65;
      margin-bottom: 1.25rem;
    }
    .gate-actions {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0b1936;
      border: none;
      padding: 0.68rem 1.15rem;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
    }
    .btn-cyan {
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.48);
      color: #bae6fd;
      padding: 0.62rem 1rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .code-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .code-input {
      flex: 1;
      min-width: 190px;
      background: rgba(2, 6, 23, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      padding: 0.58rem 0.85rem;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.86rem;
    }

    .chapter-nav-footer {
      max-width: 920px;
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .status-box {
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--text-sub);
    }
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 999;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #f8fafc;
      padding: 0.75rem 1.15rem;
      border-radius: 12px;
      font-size: 0.84rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      display: none;
      max-width: 380px;
    }
  </style>
</head>
<body>

  <div class="policy-bar" id="policyBar">
    <span class="policy-pill" id="policyPill">로딩 중...</span>
    <span id="policyText">books.dmdg-live.com 전용 보안 열람실 연결 중...</span>
  </div>

  <header class="reader-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="./index.html" class="nav-btn">← 도서 목록</a>
        <div class="book-header-meta">
          <div class="book-header-title" id="bookTitle">도서 불러오는 중...</div>
          <div class="book-header-sub" id="bookSubtitle">books.dmdg-live.com 독점 열람실</div>
        </div>
      </div>

      <div class="header-right">
        <div class="mode-switch" id="modeSwitch">
          <button type="button" class="mode-btn" id="btnModePdf" onclick="switchMode('pdf')">📄 내장 PDF 뷰어 (~2026.12.31)</button>
          <button type="button" class="mode-btn" id="btnModeWeb" onclick="switchMode('web')">🔐 2027 웹 리더 미리보기</button>
        </div>
        <button type="button" class="auth-btn" id="authActionBtn" onclick="handleAuthButton()">🔑 Google 로그인</button>
        <button type="button" class="nav-btn" id="btnLogout" style="display:none;" onclick="signOutUser()">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="workspace">
    <aside class="glass-panel toc-sidebar">
      <div class="toc-head">
        <span>📑 도서 목차</span>
        <span id="tocCountBadge">0장</span>
      </div>
      <div class="toc-list" id="tocList">
        <div class="status-box" style="padding:1.5rem;">목차 로딩 중...</div>
      </div>
    </aside>

    <section class="glass-panel viewer-pane">
      <!-- Phase 1: Embedded PDF Viewer Toolbar & Stage -->
      <div id="pdfViewerContainer" style="display:none; flex:1; flex-direction:column;">
        <div class="viewer-toolbar">
          <div class="toolbar-group">
            <button type="button" class="ctrl-btn" id="btnPdfPrev" onclick="changePdfPage(-1)">◀ 이전</button>
            <input type="number" id="pdfPageInput" class="page-jump-input" min="1" value="1" onchange="jumpPdfPageInput()" />
            <span id="pdfPageTotal" style="font-size:0.82rem; color:#cbd5e1; font-family:'JetBrains Mono',monospace;">/ -</span>
            <button type="button" class="ctrl-btn" id="btnPdfNext" onclick="changePdfPage(1)">다음 ▶</button>
          </div>
          <div class="toolbar-group">
            <button type="button" class="ctrl-btn" onclick="changePdfZoom(-0.15)">🔍 -</button>
            <span id="pdfZoomLabel" style="font-size:0.8rem; color:#cbd5e1; font-family:'JetBrains Mono',monospace;">120%</span>
            <button type="button" class="ctrl-btn" onclick="changePdfZoom(0.15)">🔍 +</button>
            <button type="button" class="ctrl-btn" onclick="fitPdfWidth()">너비 맞춤</button>
          </div>
        </div>
        <div class="pdf-stage" id="pdfStage" oncontextmenu="return false;">
          <div id="pdfLoadingMsg" class="status-box">🔒 전용 보안 PDF 스트림을 불러오는 중입니다...</div>
          <div class="pdf-canvas-wrap" id="pdfCanvasWrap" style="display:none;">
            <canvas id="pdfCanvas"></canvas>
            <div class="watermark-layer" id="pdfWatermarkLayer"></div>
          </div>
        </div>
      </div>

      <!-- Phase 2: Authenticated Web Reader Toolbar & Stage -->
      <div id="webViewerContainer" style="display:none; flex:1; flex-direction:column;">
        <div class="viewer-toolbar">
          <div class="toolbar-group">
            <span id="webTierBadge" style="font-size:0.78rem; font-weight:800; color:#fde68a; background:rgba(245,158,11,0.16); border:1px solid rgba(251,191,36,0.35); padding:0.25rem 0.7rem; border-radius:9999px;">확인 중...</span>
            <span id="webUserEmail" style="font-size:0.78rem; color:#94a3b8;"></span>
          </div>
          <div class="toolbar-group">
            <input type="text" id="topCodeInput" class="code-input" style="min-width:150px; padding:0.3rem 0.65rem; font-size:0.78rem;" placeholder="VIP / 수강생 초대코드" />
            <button type="button" class="ctrl-btn" onclick="redeemCode('topCodeInput')">코드 적용</button>
            <button type="button" class="ctrl-btn" id="btnClearPass" style="display:none;" onclick="clearPassToken()">인증 해제</button>
          </div>
        </div>
        <div class="web-stage" id="webStage">
          <div class="status-box">도서 본문을 준비 중입니다...</div>
        </div>
      </div>
    </section>
  </main>

  <div class="web-watermark-layer" id="webWatermarkLayer"></div>
  <div class="toast" id="toast"></div>

  <script>
    const FIREBASE_CONFIG = {
      apiKey: 'AIzaSyBcS8aS5yHk2KFNYPImXslsFkSyoBwYrKI',
      authDomain: 'dmdg-live.firebaseapp.com',
      projectId: 'dmdg-live',
      storageBucket: 'dmdg-live.firebasestorage.app',
      messagingSenderId: '357433220336',
      appId: '1:357433220336:web:1a8914811da09123a0f635',
      measurementId: 'G-RRYE7JKKWX'
    };

    const STREAM_PDF_ENDPOINT = 'https://us-central1-dmdg-live.cloudfunctions.net/streamBookPdf';

    if (!firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
    const auth = firebase.auth();
    const functions = firebase.app().functions('us-central1');

    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    if (typeof mermaid !== 'undefined') {
      mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict' });
    }

    const params = new URLSearchParams(window.location.search);
    const BOOK_ID = (params.get('book') || '').trim();
    const REQUESTED_MODE = (params.get('mode') || '').trim().toLowerCase();

    const state = {
      policy: null,
      entitlement: null,
      book: null,
      mode: 'pdf',
      activeChapterIdx: 0,
      pdfDoc: null,
      pdfPageNum: 1,
      pdfScale: 1.2,
      pdfLoadedForUserKey: null,
      pdfRenderTask: null,
      currentUser: null,
      passToken: localStorage.getItem('dmdg_book_pass_token') || ''
    };

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && ['s', 'p'].includes(e.key.toLowerCase())) {
        e.preventDefault();
        showToast('books.dmdg-live.com 보안 열람실에서는 저장 및 인쇄가 제한됩니다.');
      }
      if (state.mode === 'pdf' && state.pdfDoc && document.activeElement?.tagName !== 'INPUT') {
        if (e.key === 'ArrowLeft') changePdfPage(-1);
        if (e.key === 'ArrowRight') changePdfPage(1);
      }
    });

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._readerToastTimer);
      window._readerToastTimer = setTimeout(() => { el.style.display = 'none'; }, 4200);
    }

    function escHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function updateAuthUI() {
      const btn = document.getElementById('authActionBtn');
      const logoutBtn = document.getElementById('btnLogout');
      if (state.currentUser) {
        btn.className = 'auth-btn logged-in';
        btn.textContent = `👤 ${state.currentUser.email || '회원 로그인됨'}`;
        logoutBtn.style.display = 'inline-flex';
      } else {
        btn.className = 'auth-btn';
        btn.textContent = '🔑 Google 로그인';
        logoutBtn.style.display = 'none';
      }
    }

    async function signInWithGoogle() {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
        showToast('Google 로그인 완료! 열람 권한을 동기화합니다.');
      } catch (err) {
        console.error('Auth error:', err);
        if (err && err.code === 'auth/configuration-not-found') {
          showToast('Firebase 콘솔에서 Authentication(Google 로그인) 활성화가 필요합니다. 활성화 전까지는 초대코드로 바로 인증할 수 있습니다.');
        } else if (err && err.code === 'auth/unauthorized-domain') {
          showToast('Firebase Authentication 승인된 도메인에 books.dmdg-live.com 등록이 필요합니다.');
        } else if (err && err.code !== 'auth/popup-closed-by-user') {
          showToast(err.message || '로그인 중 오류가 발생했습니다.');
        }
      }
    }

    function handleAuthButton() {
      if (!state.currentUser) {
        signInWithGoogle();
      } else {
        switchMode('web');
      }
    }

    async function signOutUser() {
      await auth.signOut();
      showToast('로그아웃되었습니다.');
    }

    async function fetchBookReaderData() {
      if (!BOOK_ID) {
        document.getElementById('bookTitle').textContent = '도서 ID가 지정되지 않았습니다.';
        document.getElementById('tocList').innerHTML = '<div class="status-box">목록에서 도서를 선택해 주세요.</div>';
        return;
      }

      try {
        const callGetBookReader = functions.httpsCallable('getBookReader');
        const res = await callGetBookReader({
          bookId: BOOK_ID,
          passToken: state.passToken || null
        });
        const data = res.data;
        state.policy = data.policy;
        state.entitlement = data.entitlement;
        state.book = data.book;

        document.title = `${state.book.title} | DMDG Books 독점 열람실`;
        document.getElementById('bookTitle').textContent = state.book.title;
        document.getElementById('bookSubtitle').textContent = `Book ${BOOK_ID} · 총 ${state.book.chapter_count}개 섹션 · books.dmdg-live.com 독점 제공`;

        renderPolicyBanner();
        renderToc();

        const isPost2027 = Boolean(state.policy && state.policy.isPost2027);
        if (isPost2027) {
          state.mode = (REQUESTED_MODE === 'pdf' && state.entitlement.hasFullAccess) ? 'pdf' : 'web';
        } else {
          state.mode = (REQUESTED_MODE === 'web') ? 'web' : 'pdf';
        }
        await applyActiveMode();
      } catch (err) {
        console.error('getBookReader error:', err);
        const msg = err?.message || '도서 정보를 불러오지 못했습니다.';
        document.getElementById('bookTitle').textContent = '열람 불가';
        document.getElementById('tocList').innerHTML = `<div class="status-box">${escHtml(msg)}</div>`;
        document.getElementById('pdfLoadingMsg').textContent = msg;
        showToast(msg);
      }
    }

    function renderPolicyBanner() {
      const pill = document.getElementById('policyPill');
      const text = document.getElementById('policyText');
      const btnPdf = document.getElementById('btnModePdf');
      const btnWeb = document.getElementById('btnModeWeb');

      if (!state.policy) return;
      if (state.policy.isPost2027) {
        pill.className = 'policy-pill paid';
        pill.textContent = '🔐 2027 회원/인증 전용 운영 중';
        text.textContent = '2027-01-01부터 회원/인증 전용 웹 리더로 전환되었습니다. (앞 2개 섹션 무료 미리보기)';
        btnWeb.textContent = '🔐 회원 전용 웹 리더';
        btnPdf.style.display = state.entitlement?.hasFullAccess ? 'inline-flex' : 'none';
      } else {
        pill.className = 'policy-pill';
        pill.textContent = `🎁 ~2026.12.31 무료 열람 (D-${state.policy.daysUntilCutover})`;
        text.textContent = '현재 내장 PDF 뷰어 무료 열람 기간입니다. 2027-01-01부터 회원/인증 전용 웹 리더로 자동 전환됩니다.';
        btnWeb.textContent = '🔐 2027 웹 리더 미리보기';
        btnPdf.style.display = 'inline-flex';
      }
    }

    function renderToc() {
      const list = document.getElementById('tocList');
      const chapters = state.book?.chapters || [];
      document.getElementById('tocCountBadge').textContent = `${chapters.length}개`;

      list.innerHTML = chapters.map((ch, idx) => {
        const activeCls = idx === state.activeChapterIdx ? 'active' : '';
        const partCls = ch.is_part ? 'is-part' : '';
        const lockIcon = ch.locked ? '<span title="회원/인증 필요">🔒</span>' : '';
        return `
          <div class="toc-item ${partCls} ${activeCls}" style="padding-left:${Math.min(ch.depth || 0, 2) * 12 + 10}px;" onclick="selectChapter(${idx})">
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escHtml(ch.subject)}</span>
            ${lockIcon}
          </div>
        `;
      }).join('');
    }

    async function selectChapter(idx) {
      state.activeChapterIdx = idx;
      renderToc();
      if (state.mode !== 'web') {
        await switchMode('web');
      } else {
        renderWebChapter();
      }
    }

    async function switchMode(mode) {
      if (mode === 'pdf' && state.policy?.isPost2027 && !state.entitlement?.hasFullAccess) {
        showToast('2026-12-31 무료 PDF 열람이 종료되었습니다. 회원/인증 전용 웹 리더를 이용해 주세요.');
        mode = 'web';
      }
      state.mode = mode;
      await applyActiveMode();
    }

    async function applyActiveMode() {
      const pdfBox = document.getElementById('pdfViewerContainer');
      const webBox = document.getElementById('webViewerContainer');
      const btnPdf = document.getElementById('btnModePdf');
      const btnWeb = document.getElementById('btnModeWeb');

      btnPdf.className = `mode-btn ${state.mode === 'pdf' ? 'active-pdf' : ''}`;
      btnWeb.className = `mode-btn ${state.mode === 'web' ? 'active-web' : ''}`;

      if (state.mode === 'pdf') {
        pdfBox.style.display = 'flex';
        webBox.style.display = 'none';
        await ensurePdfLoaded();
      } else {
        pdfBox.style.display = 'none';
        webBox.style.display = 'flex';
        renderWebHeaderMeta();
        renderWebChapter();
      }
      renderWatermarks();
    }

    function renderWatermarks() {
      const email = state.entitlement?.email || state.currentUser?.email || '';
      const pdfWm = document.getElementById('pdfWatermarkLayer');
      const webWm = document.getElementById('webWatermarkLayer');

      const wmText = email
        ? `Licensed to: ${email} · books.dmdg-live.com`
        : 'books.dmdg-live.com · 무료 열람 (~2026.12.31)';

      pdfWm.innerHTML = Array.from({ length: 4 }, () => `<div class="watermark-text">${escHtml(wmText)}</div>`).join('');
      webWm.textContent = wmText;
    }

    async function ensurePdfLoaded() {
      const userKey = state.currentUser ? state.currentUser.uid : 'anon';
      if (state.pdfDoc && state.pdfLoadedForUserKey === userKey) {
        await renderPdfPage(state.pdfPageNum);
        return;
      }

      const loadingMsg = document.getElementById('pdfLoadingMsg');
      const canvasWrap = document.getElementById('pdfCanvasWrap');
      loadingMsg.style.display = 'block';
      loadingMsg.textContent = '🔒 전용 보안 PDF 스트림을 불러오는 중입니다...';
      canvasWrap.style.display = 'none';

      try {
        const headers = { 'X-DMDG-Viewer': 'books-pdfjs' };
        if (state.passToken) {
          headers['X-DMDG-Pass-Token'] = state.passToken;
        }
        if (state.currentUser) {
          const idToken = await state.currentUser.getIdToken();
          headers['Authorization'] = `Bearer ${idToken}`;
        }

        const res = await fetch(`${STREAM_PDF_ENDPOINT}?bookId=${encodeURIComponent(BOOK_ID)}`, {
          method: 'GET',
          headers
        });

        if (!res.ok) {
          let errMsg = `PDF 로드 실패 (HTTP ${res.status})`;
          try {
            const errJson = await res.json();
            if (errJson.message) errMsg = errJson.message;
            if (errJson.code === 'CUTOVER_TO_WEB_READER') {
              showToast(errMsg);
              await switchMode('web');
              return;
            }
          } catch (_) {}
          loadingMsg.textContent = errMsg;
          return;
        }

        const buf = await res.arrayBuffer();
        const loadingTask = pdfjsLib.getDocument({ data: buf });
        state.pdfDoc = await loadingTask.promise;
        state.pdfLoadedForUserKey = userKey;
        state.pdfPageNum = Math.min(state.pdfPageNum, state.pdfDoc.numPages) || 1;

        document.getElementById('pdfPageTotal').textContent = `/ ${state.pdfDoc.numPages}`;
        document.getElementById('pdfPageInput').max = state.pdfDoc.numPages;

        loadingMsg.style.display = 'none';
        canvasWrap.style.display = 'inline-block';
        await renderPdfPage(state.pdfPageNum);
      } catch (err) {
        console.error('PDF load error:', err);
        loadingMsg.textContent = 'PDF 뷰어 로딩 중 오류가 발생했습니다. 2027 웹 리더 미리보기를 이용해 보세요.';
      }
    }

    async function renderPdfPage(num) {
      if (!state.pdfDoc) return;
      const pageNum = Math.max(1, Math.min(state.pdfDoc.numPages, num));
      state.pdfPageNum = pageNum;
      document.getElementById('pdfPageInput').value = pageNum;
      document.getElementById('btnPdfPrev').disabled = pageNum <= 1;
      document.getElementById('btnPdfNext').disabled = pageNum >= state.pdfDoc.numPages;
      document.getElementById('pdfZoomLabel').textContent = `${Math.round(state.pdfScale * 100)}%`;

      const page = await state.pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: state.pdfScale });
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      const canvas = document.getElementById('pdfCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width = `${Math.floor(viewport.width)}px`;
      canvas.style.height = `${Math.floor(viewport.height)}px`;

      if (state.pdfRenderTask) {
        try { state.pdfRenderTask.cancel(); } catch (_) {}
      }

      const renderCtx = {
        canvasContext: ctx,
        viewport,
        transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null
      };
      state.pdfRenderTask = page.render(renderCtx);
      try {
        await state.pdfRenderTask.promise;
      } catch (err) {
        if (err && err.name !== 'RenderingCancelledException') throw err;
      }
    }

    function changePdfPage(delta) {
      if (!state.pdfDoc) return;
      renderPdfPage(state.pdfPageNum + delta);
      document.getElementById('pdfStage').scrollTop = 0;
    }

    function jumpPdfPageInput() {
      const val = parseInt(document.getElementById('pdfPageInput').value, 10);
      if (Number.isFinite(val)) renderPdfPage(val);
    }

    function changePdfZoom(delta) {
      state.pdfScale = Math.max(0.6, Math.min(2.4, +(state.pdfScale + delta).toFixed(2)));
      renderPdfPage(state.pdfPageNum);
    }

    async function fitPdfWidth() {
      if (!state.pdfDoc) return;
      const page = await state.pdfDoc.getPage(state.pdfPageNum);
      const baseVp = page.getViewport({ scale: 1 });
      const stageWidth = Math.max(320, document.getElementById('pdfStage').clientWidth - 48);
      state.pdfScale = Math.max(0.6, Math.min(2.0, +(stageWidth / baseVp.width).toFixed(2)));
      await renderPdfPage(state.pdfPageNum);
    }

    function renderWebHeaderMeta() {
      const badge = document.getElementById('webTierBadge');
      const emailEl = document.getElementById('webUserEmail');
      const clearBtn = document.getElementById('btnClearPass');
      const ent = state.entitlement || { tierLabel: '비회원', email: null };
      badge.textContent = ent.hasFullAccess ? `🔓 ${ent.tierLabel}` : `🔒 ${ent.tierLabel} (앞 2개 섹션 미리보기)`;
      emailEl.textContent = ent.email ? ent.email : (ent.passVerified ? '초대코드 인증됨' : '로그인 전');
      if (clearBtn) {
        clearBtn.style.display = state.passToken ? 'inline-flex' : 'none';
      }
    }

    async function clearPassToken() {
      state.passToken = '';
      localStorage.removeItem('dmdg_book_pass_token');
      showToast('초대코드 인증이 해제되었습니다.');
      await fetchBookReaderData();
    }

    function renderWebChapter() {
      const stage = document.getElementById('webStage');
      const chapters = state.book?.chapters || [];
      if (!chapters.length) {
        stage.innerHTML = '<div class="status-box">수록된 챕터가 없습니다.</div>';
        return;
      }

      const ch = chapters[state.activeChapterIdx] || chapters[0];
      const total = chapters.length;
      const prevBtn = `<button type="button" class="ctrl-btn" ${state.activeChapterIdx <= 0 ? 'disabled' : ''} onclick="selectChapter(${state.activeChapterIdx - 1})">◀ 이전 챕터</button>`;
      const nextBtn = `<button type="button" class="ctrl-btn" ${state.activeChapterIdx >= total - 1 ? 'disabled' : ''} onclick="selectChapter(${state.activeChapterIdx + 1})">다음 챕터 ▶</button>`;

      if (ch.locked) {
        const loginBlock = !state.currentUser
          ? `<button type="button" class="btn-primary" onclick="signInWithGoogle()">🔑 Google 로그인하고 열람 권한 확인하기</button>`
          : `<div style="font-size:0.84rem; color:#7dd3fc; background:rgba(56,189,248,0.12); border:1px solid rgba(56,189,248,0.3); padding:0.6rem 0.9rem; border-radius:10px;">현재 로그인 계정: <strong>${escHtml(state.currentUser.email)}</strong> (${escHtml(state.entitlement?.tierLabel || '무료 회원')})</div>`;
        const pdfFallbackBtn = !state.policy?.isPost2027
          ? `<button type="button" class="btn-cyan" style="flex:1;" onclick="switchMode('pdf')">📄 ~2026.12.31 무료 PDF 뷰어로 보기</button>`
          : '';

        stage.innerHTML = `
          <div class="chapter-header-box">
            <span class="chapter-badge">🔒 회원/인증 전용 챕터</span>
            <h2 class="chapter-title">${escHtml(ch.subject)}</h2>
          </div>
          <div class="lock-gate-card">
            <div class="lock-gate-title">🔐 2027 회원/인증 전용 콘텐츠 잠금</div>
            <p class="lock-gate-desc">
              무료 미리보기(프롤로그 및 Part 1 도입부 2개 섹션) 이후의 본문은
              <strong>로그인한 구독/단건 소장/VIP 초대코드 회원</strong>에게만 서버에서 안전하게 전달됩니다.
            </p>
            <div class="gate-actions">
              ${loginBlock}
              <div class="code-row">
                <input type="text" id="gateCodeInput" class="code-input" placeholder="VIP / 수강생 초대코드 입력" />
                <button type="button" class="btn-cyan" onclick="redeemCode('gateCodeInput')">🎟️ 초대코드 인증</button>
              </div>
              <div style="display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:0.25rem;">
                <a href="https://dmdg-live.com/store.html" target="_blank" rel="noopener noreferrer" class="btn-cyan" style="flex:1;">💳 단건 / Pro 구독 안내 ↗</a>
                ${pdfFallbackBtn}
              </div>
            </div>
          </div>
          <div class="chapter-nav-footer">${prevBtn}${nextBtn}</div>
        `;
        return;
      }

      const rawHtml = typeof marked !== 'undefined'
        ? marked.parse(ch.content_md || '', { gfm: true, breaks: false })
        : `<pre>${escHtml(ch.content_md || '')}</pre>`;
      const cleanHtml = typeof DOMPurify !== 'undefined'
        ? DOMPurify.sanitize(rawHtml, { ADD_TAGS: ['iframe'], ADD_ATTR: ['target', 'rel', 'style', 'class', 'allowfullscreen'] })
        : rawHtml;

      stage.innerHTML = `
        <div class="chapter-header-box">
          <span class="chapter-badge">${ch.is_part ? 'PART 개요' : 'CHAPTER 본문'} · ${state.activeChapterIdx + 1} / ${total}</span>
          <h2 class="chapter-title">${escHtml(ch.subject)}</h2>
        </div>
        <article class="md-body" id="mdArticle">${cleanHtml}</article>
        <div class="chapter-nav-footer">${prevBtn}${nextBtn}</div>
      `;
      stage.scrollTop = 0;

      const article = document.getElementById('mdArticle');
      enhanceArticle(article);
    }

    function enhanceArticle(article) {
      if (!article) return;

      article.querySelectorAll('pre code').forEach((block) => {
        const cls = block.className || '';
        if (cls.includes('language-mermaid')) {
          const pre = block.parentElement;
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = block.textContent;
          pre.replaceWith(div);
          return;
        }
        if (typeof hljs !== 'undefined') {
          try { hljs.highlightElement(block); } catch (_) {}
        }
        const pre = block.parentElement;
        if (pre && !pre.querySelector('.copy-code-btn')) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'copy-code-btn';
          btn.textContent = '복사';
          btn.onclick = async () => {
            try {
              await navigator.clipboard.writeText(block.textContent || '');
              btn.textContent = '복사됨 ✓';
              setTimeout(() => { btn.textContent = '복사'; }, 1600);
            } catch (_) {
              showToast('클립보드 복사에 실패했습니다.');
            }
          };
          pre.appendChild(btn);
        }
      });

      if (typeof renderMathInElement === 'function') {
        try {
          renderMathInElement(article, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            throwOnError: false
          });
        } catch (_) {}
      }

      if (typeof mermaid !== 'undefined' && article.querySelector('.mermaid')) {
        try {
          mermaid.run({ nodes: article.querySelectorAll('.mermaid') });
        } catch (_) {}
      }
    }

    async function redeemCode(inputId) {
      const el = document.getElementById(inputId);
      const code = (el ? el.value : '').trim();
      if (!code) {
        showToast('초대코드를 입력해 주세요.');
        return;
      }

      try {
        const callRedeem = functions.httpsCallable('redeemBookAccessCode');
        const res = await callRedeem({ code });
        if (res.data && res.data.passToken) {
          state.passToken = res.data.passToken;
          localStorage.setItem('dmdg_book_pass_token', state.passToken);
        }
        if (el) el.value = '';
        showToast(`인증 완료: ${res.data?.tierLabel || 'VIP 초대코드 회원'}이 활성화되었습니다!`);
        await fetchBookReaderData();
        await switchMode('web');
      } catch (err) {
        console.error('redeemBookAccessCode error:', err);
        showToast(err?.message || '유효하지 않은 코드이거나 인증에 실패했습니다.');
      }
    }

    let initialized = false;
    auth.onAuthStateChanged(async (user) => {
      state.currentUser = user || null;
      updateAuthUI();
      if (!initialized || user || state.book) {
        initialized = true;
        await fetchBookReaderData();
      }
    });
  </script>
</body>
</html>
