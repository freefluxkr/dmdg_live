<h2>4.10 diff 명령어</h2>
<p class="x00--"><span class="A------ x3-------1">diff</span> 명령어는 커밋 간 차이를 확인합니다. 보통 리눅스나 <span class="A------">macOS</span> 같은 유닉스 계열의 운영 체제에는 유용한 <span class="A------ x3-------1">diff</span> 명령어가 있습니다. 깃 또한 초기 시작은 리눅스 커널을 개발하려는 것이었기 때문에 유사한 기능을 하는 <span class="A------ x3-------1">diff</span> 명령어를 제공합니다.</p>
