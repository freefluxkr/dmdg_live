<h3>2.1.3 macOS에서 설치</h3>
<p class="x00--">최근 들어 <span class="A------">macOS</span> 운영 체제를 개발 환경으로 사용하는 사람이 많아졌습니다. <span class="A------">macOS</span>도 유닉스와 비슷한 <span class="A------">NextStep</span>을 기반으로 발전된 운영 체제이기 때문에 대부분의 사용법은 리눅스와 비슷합니다. 또 리눅스와 마찬가지로 최근 <span class="A------">macOS</span> 시스템에는 대부분 깃이 기본으로 설치되어 있습니다.</p>
<p class="x00--">특정 버전의 깃을 설치하고 싶다면 깃 공식 사이트에 접속하여 <span class="A------">macOS</span>용 <span class="A------">git</span> 패키지를 내려받습니다. <span class="A------">dmg</span> 파일을 내려받은 후 <span class="A------">dmg</span> 파일 안에 있는 <span class="A------">pkg</span> 파일을 실행하면 깃이 설치됩니다.<span class="x8-----"><a class="footnote-link" href="https://thebook.io/080212/0064/#footnote-270800-2" id="footnote-270800-2-backlink">2</a></span></p>
