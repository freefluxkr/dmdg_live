<h2>6.7 HEAD 포인터</h2>
<p class="x00--">깃은 객체의 포인터 개념을 사용합니다. 대표적인 객체 포인터는 <span class="A------">HEAD</span>입니다. 깃 동작을 정확히 이해하려면 먼저 <span class="A------">HEAD</span>가 무엇인지 알아 두는 것이 좋습니다.</p>
<p class="x00--"><span class="A------">HEAD</span>는 <span class="A------">4</span>장 커밋에서 잠시 학습했습니다. 이 절에서 좀 더 자세히 알아봅니다.</p>
