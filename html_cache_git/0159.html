<h3>4.7.2 소스트리에서 빈 커밋</h3>
<p class="x00--">소스트리에서는 메시지가 없는 빈 커밋을 하기가 더 쉽습니다. 예를 들어 <span class="x3---------">파일 상태</span> 탭을 선택한 후 아래쪽의 커밋 메시지 입력란을 비워 두고 <span class="x3---------">커밋</span>을 누르면 됩니다. 그러면 다음과 같은 확인 메시지가 표시됩니다. <span class="x3---------">확인</span>을 누르세요. 이렇게 경고문을 알리는 것은 커밋 작업이 반드시 메시지를 작성하는 것을 원칙으로 하고 있기 때문입니다.</p>
