<h2>10.10 정리</h2>
<p class="x00--">태그는 완성된 코드를 배포하고 관리하는 데 매우 유용합니다. 또 최종 사용자는 태그를 확인하여 어떤 커밋이 완성된 코드인지 쉽게 확인할 수 있습니다.</p>
<p class="x00--">태그 버전은 패키지들이 배포하고 업데이트하는 기준이기 때문에 <span class="A------">PHP</span>의 컴포저나 <span class="A------">Node</span>.<span class="A------">js</span>의 패키지 등을 개발할 때도 유용하게 사용할 수 있습니다. </p>
<p class="x00--">실제 현장에서는 코드를 개발하는 과정도 중요하지만, 태그를 사용하여 버전을 유지 관리하는 것도 매우 중요합니다. 아무리 잘 만든 제품이라도 배포와 태그를 잘 관리하지 않는다면 최종 사용자들은 혼돈에 빠지게 됩니다.</p>
