<h2>5.6 수동으로 내려받기</h2>
<p class="x00--">원격 저장소 내용을 내려받는 방법은 크게 두 가지입니다. <span class="A------ x3-------1">pull</span>(풀)과 <span class="A------ x3-------1">fetch</span>(페치)입니다. 이 두 방법의 차이는 병합을 자동 처리하는지 여부입니다. 병합은 <span class="A------">8</span>장에서 자세히 설명합니다. 이 장에서는 페치 병합 방법만 알고 넘어갑니다.</p>
