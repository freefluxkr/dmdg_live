<h2>5.2 깃허브 서버 준비</h2>
<p class="x00--">독립적인 깃 서버를 직접 운영하여 사용할 수 있습니다. 하지만 <span class="A------">365</span>일 안정적인 서버를 운영하는 것은 쉽지 않습니다. 직접 서버를 운영하지 않아도 전문적인 깃 호스팅으로 서버를 대체할 수 있습니다. 호스팅을 받으면 직접 서버를 관리하지 않아도 쉽게 원격 저장소를 운영할 수 있습니다.</p>
