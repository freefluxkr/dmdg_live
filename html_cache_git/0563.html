<h2>12.2 reflog</h2>
<p class="x00--">깃은 안정적인 작업을 유지하려고 참조된 모든 <span class="A------">refs</span>를 기록합니다. 그리고 내부적으로 작업한 모든 <span class="A------">HEAD</span>와 브랜치 포인터를 기록합니다. 이때 사용된 포인터들의 기록을 <span class="A------">re</span><span class="A------">f</span><span class="A------">log</span>라고 합니다.</p>
