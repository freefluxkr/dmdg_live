<h2>2.4 환경 설정</h2>
<p class="x00--">지금까지는 다양한 환경에서 깃을 설치하는 방법을 알아보았습니다. 깃을 설치했다면 여러 가지 환경 설정도 해야 합니다. 사용자 이름과 이메일 주소는 필수 항목이고, 그 외 나머지 항목은 옵션이므로 추가 항목은 가볍게 살펴봅니다.</p>
