<h2>5.1 서버 저장소</h2>
<p class="x00--">서버 저장소는 다른 말로 <span class="x3---------">원격</span><span class="x3------">(</span><span class="A------ x3------">remote</span><span class="x3------">)</span> <span class="x3---------">저장소</span>라고도 합니다. 서버 저장소는 로컬 저장소의 코드를 복제한 복사본이라고 할 수 있습니다. 서버를 이용하면 코드를 안전하게 보관할 수 있습니다. 또 서버에 있는 소스 코드는 다른 사람들과 공유하고 협업하여 개발을 진행할 수도 있습니다.</p>
