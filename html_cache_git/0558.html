<h2>12.1 refs</h2>
<p class="x00--">깃은 커밋으로 코드 이력을 관리합니다. 커밋은 고유의 <span class="A------">SHA</span><span class="A------">1</span> 해시 값을 가지고 있으며, 이 해시 값은 여러 기능에서 참조합니다. 깃에서는 참조하는 해시 값을 <span class="A------">refs</span> 목록으로 가지고 있습니다.</p>
