<h3>4.10.1 파일 간 차이</h3>
<p class="x00--">깃의 장점은 파일들의 수정 이력을 커밋이라는 형태로 구분할 수 있다는 것입니다. 앞에서 살펴보았듯이, 깃은 커밋으로 파일들의 수정 내역을 추적합니다. 파일 수정이란 파일 내용 일부가 수정, 추가, 삭제되는 것을 의미합니다. 개발하면서 수많은 소스 코드가 수정, 추가, 삭제되곤 합니다.</p>
<p class="x00--">깃은 커밋을 기준으로 이러한 파일들의 수정 이력을 비교해 볼 수 있는 <span class="A------ x3-------1">diff</span> 기능을 제공합니다. <span class="A------ x3-------1">diff</span> 기능으로 파일의 수정 및 변경 내역을 쉽게 파악할 수 있습니다.</p>
