<h3>9.2.6 소스트리</h3>
<p class="x00--">리셋하려면 복귀 시점의 커밋 해시 값이 필요합니다. 하지만 매번 로그를 검색하여 리셋하는 것은 불편합니다. 소스트리를 이용하면 더 쉽게 리셋할 수 있습니다. 앞에서 이미 실습했기 때문에 여기서는 메뉴만 확인해 주세요. </p>
<p class="x00--">먼저 소스트리의 커밋 그래프에서 복귀할 커밋을 선택합니다. 그리고 마우스 오른쪽 버튼을 눌러 <span class="x3---------">이 커밋까지 현재 브랜치를 초기화</span> 메뉴를 선택합니다.</p>
