<h2>6.8 생성과 이동</h2>
<p class="x00--">깃의 브랜치를 생성하는 동작과 이동하는 동작은 별개입니다. 브랜치 생성은 <span class="A------ x3-------1">branch</span> 명령어를 사용하고, 브랜치 이동은 <span class="A------ x3-------1">checkout</span> 명령어를 사용합니다. 브랜치를 생성하면서 동시에 생성된 브랜치로 이동하려면 별도의 명령을 실행해야 합니다. </p>
