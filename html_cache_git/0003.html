<h2>1.1 버전 관리</h2>
<p class="x00--">프로그래밍은 컴퓨터 언어로 글을 작성하는 창작 활동이라고 할 수 있습니다. 또 프로그래밍 개발 과정은 수많은 코드를 변경하고 테스트하는 것입니다. 지속적으로 변경되는 과정 속에서 코드는 잠시 불안정한 수정 상태와 안정된 상태를 반복합니다. 개발자는 안정된 상태의 코드와 불안정한 상태의 코드를 인지하고, 항상 안정된 상태를 유지하도록 노력해야 합니다.</p>
