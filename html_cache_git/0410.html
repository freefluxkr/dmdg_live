<h3>8.7.10 리베이스할 때 주의할 점</h3>
<p class="x00--">리베이스는 커밋 위치와 해시 값을 변경합니다. <span class="x3---------">저장소를 외부에 공개했다면 공개된 순간부터 커밋은 리베이스를 사용하지 않는 것이 원칙</span>입니다.</p>
<p class="x00--">리베이스는 외부로 코드를 푸시하거나 공개하기 전에 로컬에서만 실행하는 것이 좋습니다. 외부에 공개된 커밋을 리베이스하면 커밋 위치와 해시 값이 변경되어 너무 혼란스럽습니다. 공개된 커밋을 변경할 때는 다음 장에서 배울 <span class="A------ x3-------1">revert</span> 명령어를 사용합니다.</p>
