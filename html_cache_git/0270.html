<h3>6.9.2 실습 준비</h3>
<p class="x00--"><span>실습을 위해 깃허브에 새로운 실습 저장소를 하나 생성합시다. 저장소는 </span><span class="A------">5</span><span>장에서 설명했듯이, 반드시 자신의 계정으로 로그인합니다. </span><span class="A------ x3---------">New</span><span class="x3---------"> </span><span>버튼 또는 </span><span class="x3---------">+ &gt; </span><span class="A------ x3---------">New</span><span class="x3---------"> </span><span class="A------ x3---------">repository</span><span>를 클릭합니다. </span><span class="A------ x3---------">Repository</span><span class="x3---------"> </span><span class="A------ x3---------">name</span><span>에 깃허브의 저장소 이름을 입력합니다. 필자는 이름을 </span><span class="A------">gitstudy</span><span class="A------">06</span><span>으로 했습니다.</span></p>
