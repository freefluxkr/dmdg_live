<h2>12.4 replace</h2>
<p class="x00--">기본적으로 한 번 생성된 객체는 변경할 수 없습니다. 커밋을 변경하려면 깃의 원리를 응용해야 합니다. 커밋이 참조하는 해시 값을 속여서 다른 커밋으로 변경하는 것입니다. <span class="A------ x3---------">replace</span><span class="x3---------">는 기존 커밋을 다른 커밋인 것처럼 변경하는 기능</span>입니다. </p>
<p class="x00--">깃 저장소에서 오랫동안 작업하면 수많은 커밋 기록이 쌓입니다. 커밋이 많아지면 저장소 크기도 증가합니다. 저장소를 분리할 수 있는 서브모듈이 있지만, 오래된 저장소와는 다릅니다. 이때 <span class="A------">replace</span>를 사용하면 커밋이 많은 오래된 저장소를 분리할 수 있습니다. </p>
