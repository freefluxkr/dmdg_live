<h3 class="txt1 dm" id="sigil_toc_id_26"><span class="purple">2.5.2</span> Swagger UI 화면 구성</h3>
<p class="txt bl">잠시 Swagger UI에 대해 짚고 넘어가겠습니다. <span class="dm">Swagger UI</span>는 FastAPI가 자동으로 생성하는 API 문서 및 테스트 도구입니다. 각 API 엔드포인트에 대해 요청과 응답을 시각적으로 보여 주고 직접 테스트할 수 있습니다.</p>
<p class="txt bl">Swagger UI는 총 8개 영역으로 구성됩니다. 화면이 길기 때문에 순서대로 구분해 설명합니다.</p>
