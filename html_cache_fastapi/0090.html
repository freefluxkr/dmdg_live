<h3 class="txt1 dm" id="sigil_toc_id_17"><span class="purple">2.2.1</span> 기본 사용법</h3>
<p class="txt bl">경로의 기본 사용법을 알아보기 전에 데코레이터가 무엇인지 짚고 넘어가겠습니다.</p>
<p class="txt bl"><span class="dm">데코레이터</span><span class="txts gray">(decorator)</span>는 함수를 감싸서 실행 흐름이나 동작을 확장하는 파이썬 문법입니다. FastAPI는 이 데코레이터 문법을 활용해 HTTP 요청과 파이썬 함수를 연결합니다. 즉, FastAPI의 경로 데코레이터 사용 방법을 일반화하면, 다음과 같이 특정 HTTP 메서드와 URL 경로를 함수에 매핑하는 형태로 표현할 수 있습니다.</p>
