  FastAPI 개요</h2>
<div class="box_purple_line"></div>
<p class="txt bl">FastAPI를 이해하려면 먼저 웹 애플리케이션이 어떤 구조로 동작하는지 살펴봐야 합니다. 우리가 사용하는 대부분의 웹 서비스는 <span class="dm">클라이언트-서버 모델</span><span class="txts gray">(client-server model)</span>을 기반으로 동작하며, 웹 애플리케이션은 이 구조를 바탕으로 만들어집니다.</p>
