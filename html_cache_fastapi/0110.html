<h3 class="txt1 dm" id="sigil_toc_id_21"><span class="purple">2.3.2</span> 쿼리 파라미터의 선택적 사용</h3>
<p class="txt bl">엔드포인트 함수의 매개변수를 <span class="cd">max_price: int</span>라고 지정하면 FastAPI는 이 값을 필수로 요구합니다. 따라서 경로에 <span class="cd">?max_price=1000</span>을 포함하지 않으면 FastAPI가 에러를 발생시킵니다.</p>
<p class="txt bl">하지만 쿼리 파라미터는 대부분 선택적으로 사용되므로 서버에서 항상 이 값을 요구할 필요는 없습니다. 예를 들어 사용자가 상품을 조회할 때 항상 최대 가격을 지정하지 않을 수 있습니다.</p>
