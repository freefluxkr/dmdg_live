<h3 class="txt1 dm" id="sigil_toc_id_29"><span class="purple">2.6.2</span> 상태 코드</h3>
<p class="txt bl"><span class="dm">상태 코드</span><span class="txts gray">(status code)</span>는 클라이언트의 요청에 대해 서버가 어떤 결과를 반환했는지를 숫자와 메시지로 나타내는 표준 규약입니다. 예를 들어 <span class="cd">200 OK</span>는 요청이 성공적으로 처리되었음을 나타내고, <span class="cd">404 Not Found</span>는 요청한 데이터를 찾을 수 없음을 나타냅니다.</p>
